# 参考训练时使用的 diffusion-pipe 提交（仅作记录，不参与运行）
# trained using diffusion-pipe commit 6e95020cad0b3cd7dcb93ce42b358669051bf6d2

# 训练输出根目录；每次运行在其下新建时间戳子目录（train.py: run_dir）
output_dir = '/home/yuchuxi/Projects/Experiments/Dataset/ZhaoLora/output/guo582'

# 数据集 TOML 路径（分辨率/AR 分桶、caption_prefix、[[directory]] 等见该文件）
#dataset = '/home/yuchuxi/Projects/Experiments/Dataset/ZhaoLora/configs/ysm_train.toml'
dataset = '/home/yuchuxi/Projects/Experiments/Dataset/ZhaoLora/configs/guo582.toml'

# 验证集列表；每项为 { name, config } 或单独 TOML 路径。空列表时 evaluate() 直接跳过
eval_datasets = [
    #4{name = 'eval', config = '/home/yuchuxi/Projects/Experiments/Dataset/ZhaoLora/configs/ysm_eval.toml'},

]

# ---------- 训练 ----------
# 最大 epoch 数；一个 epoch = 训练集遍历一轮（saver.py: epoch > epochs 时结束）
epochs = 1
# 每张 GPU 每次前向/反向的样本数（DeepSpeed train_micro_batch_size_per_gpu）
micro_batch_size_per_gpu = 1
# 流水线并行段数；1 = 单卡持整模，>1 需多 GPU 切层（train.py: pipeline_stages）
pipeline_stages = 1
# 梯度累积步数；有效 batch = micro_batch × 本值 × GPU 数（train.py: global_batch_size）
gradient_accumulation_steps = 1
# 梯度裁剪最大范数；0 表示不裁剪。gradient_release 优化器时强制为 0
gradient_clipping = 0
# 学习率线性 warmup 步数；与 lr_scheduler 串联（默认 lr_scheduler='constant'，warmup 后保持常数 LR）
warmup_steps = 100
# smooth_l1_beta 用于 smooth_l1_loss，用于训练阶段；训练阶段用于降低训练损失，减少训练损失的抖动，提高训练稳定性
smooth_l1_beta = 1.0
# 学习率调度器；cosine, linear, constant
lr_scheduler = 'cosine'


# ---------- 验证 ----------
# 每 N 个 epoch 结束且 finished_epoch 时跑 eval（需 eval_datasets 非空）
eval_every_n_epochs = 1
# 按全局 step 触发 eval（与 eval_every_n_epochs 二选一或并用）
#eval_every_n_steps = 500
# 按样本数触发 eval，启动时换算为 eval_every_n_steps
#eval_every_n_examples = 2048000
# 训练第一步前是否先 eval 一次；从 checkpoint 恢复时不执行
eval_before_first_step = true
# eval 时每 GPU micro batch；可小于训练 batch 以减少 eval 集被整除丢弃的图
eval_micro_batch_size_per_gpu = 1
# eval 的梯度累积步数（PipelineDataLoader 长度会乘此值）
eval_gradient_accumulation_steps = 1

# ---------- 保存与其它 ----------
# 每 N 个 epoch 保存可推理 LoRA 到 epochN/（必须设此项或 save_every_n_steps/examples 之一）
#save_every_n_epochs = 1
save_every_n_steps = 500
#save_every_n_examples = 4096000   # 启动时除以 global_batch_size 得到 save_every_n_steps
#checkpoint_every_n_epochs = 1     # DeepSpeed 全状态 checkpoint（可 --resume_from_checkpoint）
#checkpoint_every_n_minutes = 120
# 激活检查点，降显存；'unsloth' 时自动开启 reentrant（train.py: activation_checkpointing）
activation_checkpointing = true
# 与上项配合的 reentrant checkpoint；pipeline_stages>1 时部分模型可能需要
#reentrant_activation_checkpointing = true

# 多 GPU 流水线时按参数量或 manual+partition_split 切层（train.py: partition_method）
partition_method = 'parameters'
#partition_method = 'manual'
#partition_split = [10]   # 长度须为 pipeline_stages - 1

# 保存 LoRA/权重的 dtype（set_config_defaults 转为 torch dtype）
save_dtype = 'bfloat16'
# 缓存 latent / text embedding 时 map 的 batch 大小
caching_batch_size = 1
# 数据集 map 并行进程数，覆盖默认 min(8, cpu_count)（train.py: NUM_PROC）
map_num_proc = 16
# DeepSpeed 每隔多少 step 打印 loss（ds_config steps_per_print）
steps_per_print = 1
# torch.compile 包装 PipelineModule（train.py: config['compile']）
compile = true

# ---------- 模型：type='anima' -> CosmosPredict2Pipeline（cosmos_predict2.py）----------
[model]
# 模型标识；与 cosmos_predict2 共用实现，缓存目录名固定为 anima
type = 'anima'
# ComfyUI 格式 DiT 权重（load_diffusion_model 会去掉 state_dict 的 net. 前缀）
transformer_path = '/media/yuchuxi/Data/Servers/ComfyUI/models/diffusion_models/anima-base-v1.0.safetensors'
# Wan/Qwen 系 VAE（WanVAE(vae_path)）
vae_path = '/media/yuchuxi/Data/Servers/ComfyUI/models/vae/qwen_image_vae.safetensors'
# Qwen3-0.6B safetensors；非目录时从 configs/qwen3_06b 结构加载
llm_path = '/media/yuchuxi/Data/Servers/ComfyUI/models/text_encoders/qwen_3_06b_base.safetensors'
# 训练/autocast 主 dtype
dtype = 'bfloat16'
# false 时训练阶段在线跑 LLM 编码（默认 true：先 cache text embedding，省显存）
#cache_text_embeddings = false
# llm_adapter 参数组学习率；0 则 requires_grad=False 不训练该适配器（cosmos_predict2.get_param_groups）
llm_adapter_lr = 0
# 噪声时间步采样：logit_normal（默认）或 uniform（utils/common.py sample_t）
timestep_sample_method = 'uniform'
# Flux 系 timestep shift（Anima 文档提及时可试；非 anima 专用）
#flux_shift = true
# 多尺度 loss 权重；非 null 时启用（cosmos_predict2 loss_fn）
#multiscale_loss_weight = 0.5
# logit_normal 采样后再乘 sigmoid_scale，再 sigmoid；>1 偏向更大 t（更多噪声段）
sigmoid_scale = 1.3

# ---------- LoRA（train.py: alpha 强制 = rank）----------
[adapter]
type = 'lora'
rank = 32
# 未写时默认继承 model.dtype；bfloat16 与训练一致
dtype = 'bfloat16'
dropout = 0.1

# ---------- 优化器（train.py get_optimizer；adamw -> torch.optim.AdamW）----------
[optimizer]
type = 'adamw'
lr = 2e-5
weight_decay = 0.1
betas = [0.9, 0.999]


[monitoring]
enable_wandb = true
wandb_tracker_name = 'guo582-anima'
wandb_api_key = ''
wandb_run_name = ''