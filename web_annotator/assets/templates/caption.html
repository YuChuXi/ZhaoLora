<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>描述</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  /* 描述页对话框: 分节、参数行、条目表与描述查看 */
  .cap-body {
    padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
    font-size: 12px; color: var(--text-dim);
  }
  /* 分节: 短标题在左, 说明以小字附在其右(不作标题的一部分) */
  .cap-sec { display: flex; flex-direction: column; gap: 8px; }
  .cap-sec + .cap-sec { border-top: 1px solid var(--border); padding-top: 12px; }
  .cap-sec-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .cap-sec-title { font-weight: 600; color: var(--text); }
  .cap-note { font-size: 11px; color: var(--text-dim); }
  .modal-head .cap-note { margin-left: auto; }
  /* 参数行: 左侧标签列对齐, 控件与说明同行 */
  .cap-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cap-label { flex: 0 0 88px; color: var(--text-dim); }
  .cap-ck { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .cap-ck input { margin: 0; }
  .cap-num { width: 62px; }
  /* 条目表: 表头与数据行同用一套列宽, 保证列对齐 */
  .cap-table { display: grid; grid-template-columns: 180px minmax(0, 1fr) 24px; gap: 6px; align-items: center; }
  .cap-head { font-size: 11px; color: var(--text-dim); }
  .cap-head span { padding: 0 8px; }
  .cap-list { display: flex; flex-direction: column; gap: 4px; }
  /* 新增区: 浅底块, 与下方条目列表分区 */
  .cap-add {
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px 10px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px;
  }
  .cap-add-foot { display: flex; justify-content: flex-end; }
  .cap-body input[type="text"],
  .cap-body input[type="number"],
  .cap-body select {
    background: #0a1a30; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; font-size: 12px; font-family: inherit;
  }
  .cap-sel { align-self: flex-start; }
  /* 模板句式: 只把空位替换为输入框, 句式其余部分原样显示 */
  .cap-sentence { line-height: 2.2; color: var(--text); word-break: break-word; }
  .cap-sentence.empty { font-size: 11px; color: var(--text-dim); line-height: 1.6; }
  .cap-blank {
    width: 110px; margin: 0 2px; vertical-align: middle;
    border-bottom-color: var(--accent) !important;
  }
  .cap-del {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 13px; line-height: 1; cursor: pointer; padding: 0;
  }
  .cap-del:hover { color: var(--accent); }
  /* 运行日志控制台: 任务产生日志后常驻可回看, 与打标页日志同款等宽字体 */
  .cap-log {
    max-height: 180px; overflow: auto; padding: 8px 16px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.45; color: #c8d4e0; white-space: pre-wrap;
  }
  /* 描述查看 */
  .view-caption {
    background: #0a1a30; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 8px 10px; font-size: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .view-caption .view-label { color: var(--text-dim); font-weight: 600; display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>

<div class="toolbar">
  <button class="btn green" type="button" id="btn-open">开始标注</button>
  <button class="btn danger" type="button" id="btn-cancel" hidden>取消</button>
  <span class="sep"></span>
  <span class="status-seg" id="stat-job"></span>
  <span class="status-seg" id="stat-model">-</span>
</div>

<div class="job-progress compact" id="job-progress" hidden>
  <div class="job-progress-track">
    <div class="job-progress-fill" id="progress-fill"></div>
  </div>
  <span class="job-progress-pct" id="progress-pct">0%</span>
</div>
<div class="cap-log" id="log-box" hidden></div>

<div class="masonry" id="masonry"></div>
<div class="hint" id="cap-hint">绿色=已有描述 · 点击卡片查看描述 · 描述写入各目录的 captions.json（键为文件名, 值为「粗略/详细」列表）</div>
<div class="status-bar" id="cap-status">
  <span class="status-seg">共<b id="stat-total">0</b></span>
  <span class="status-seg">已描述<b id="stat-described">0</b></span>
  <span class="status-seg">未描述<b id="stat-missing">0</b></span>
</div>

<!-- 描述设置与启动: 生成设置、提示词补充 -->
<div class="modal" id="rules-dlg" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-labelledby="rules-dlg-title"
    style="width:min(800px,94vw);height:auto;max-height:min(720px,88vh);">
    <div class="modal-head">
      <span class="modal-title" id="rules-dlg-title">描述设置</span>
      <span class="cap-note">以下设置保存在浏览器本地, 与当前数据集绑定</span>
    </div>
    <div class="modal-body cap-body">
      <section class="cap-sec">
        <div class="cap-sec-head"><span class="cap-sec-title">生成设置</span></div>
        <div class="cap-row">
          <span class="cap-label">描述模式</span>
          <span class="mode-seg" id="mode-seg"></span>
          <span class="cap-note">写入 captions.json 时按此顺序排列</span>
        </div>
        <div class="cap-row">
          <span class="cap-label">WD14 参考标签</span>
          <label class="cap-ck" title="注入 Danbooru 通用标签(取自 WD14 缓存中置信度不低于阈值的标签)">
            <input type="checkbox" id="inject-general"> 通用</label>
          <span class="cap-note">≥</span>
          <input type="number" id="general-threshold" class="cap-num" min="0" max="1" step="0.05"
            title="置信度阈值: 只注入不低于该值的通用标签">
          <label class="cap-ck" title="注入 Danbooru 角色标签(取自 WD14 缓存中置信度不低于阈值的标签)">
            <input type="checkbox" id="inject-character"> 角色</label>
          <span class="cap-note">≥</span>
          <input type="number" id="character-threshold" class="cap-num" min="0" max="1" step="0.05"
            title="置信度阈值: 只注入不低于该值的角色标签">
          <span class="cap-note">候选交给模型核对画面后取舍; 缓存缺失的图片先补建缓存</span>
        </div>
        <div class="cap-row">
          <span class="cap-label">NSFW 增强</span>
          <label class="cap-ck" title="启用后, 当 WD14 判定 Explicit 或 Questionable 的置信度不低于阈值时, 在提示词追加备注">
            <input type="checkbox" id="inject-nsfw"> 启用</label>
          <span class="cap-note">≥</span>
          <input type="number" id="nsfw-threshold" class="cap-num" min="0" max="1" step="0.05"
            title="置信度阈值: Explicit 或 Questionable 不低于该值时追加备注">
          <span class="cap-note">命中时在提示词追加「Using explicit slang.」</span>
        </div>
        <div class="cap-row">
          <span class="cap-label">已有描述</span>
          <label class="cap-ck" title="重新标注已有描述的图片, 并覆盖其 captions.json 条目">
            <input type="checkbox" id="force"> 覆盖, 重新标注并覆盖原有条目</label>
        </div>
      </section>

      <section class="cap-sec">
        <div class="cap-sec-head">
          <span class="cap-sec-title">提示词补充</span>
          <span class="cap-note">「匹配标签」命中 WD14 标签时注入; 留空则对该数据集全部图片生效</span>
        </div>
        <div class="cap-add">
          <select id="rule-template" class="cap-sel" title="内嵌模板: 选模板后其空格即成待填字段"></select>
          <div class="cap-sentence" id="rule-fields"></div>
          <div class="cap-add-foot">
            <button class="btn green" type="button" id="rule-add" title="按当前句式生成一条提示词条目">添加</button>
          </div>
        </div>
        <div class="cap-head cap-table">
          <span>匹配标签</span><span>提示词内容</span><span></span>
        </div>
        <div class="cap-list" id="rule-list"></div>
      </section>
    </div>
    <div class="modal-foot">
      <button class="btn" type="button" id="rules-close">取消</button>
      <button class="btn green" type="button" id="btn-start">开始标注</button>
    </div>
  </div>
</div>

<!-- 描述查看 -->
<div class="modal" id="view-dlg" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-labelledby="view-title"
    style="width:min(760px,94vw);height:auto;max-height:min(720px,88vh);">
    <div class="modal-head">
      <span class="modal-title" id="view-title">描述</span>
    </div>
    <div class="modal-body cap-body" id="view-body"></div>
    <div class="modal-foot">
      <button class="btn" type="button" id="view-close">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/js/ui.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/masonry.js"></script>
<script src="/static/js/caption.js"></script>
</body>
</html>
