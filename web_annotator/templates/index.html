<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>筛选</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  #booru-tags {
    background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px;
    width: min(220px, 28vw);
  }
  #bilibili-uid, #bilibili-keyword {
    background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px;
    width: min(130px, 16vw);
  }
  #bilibili-keyword { width: min(150px, 18vw); }
  #bilibili-type, #bilibili-time-from, #bilibili-time-to {
    background: var(--card-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; font-size: 12px;
  }
  .bili-time-row {
    font-size: 12px; color: var(--text-dim);
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .booru-page-wrap {
    display: inline-flex; align-items: stretch;
    border: 1px solid var(--border); border-radius: 4px;
    overflow: hidden; background: #0a1a30; height: 26px;
  }
  .booru-page-wrap input {
    width: 3.2rem; border: 0; border-radius: 0;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    background: transparent; color: var(--text);
    padding: 0 4px; font-size: 12px; text-align: center;
    -moz-appearance: textfield;
  }
  .booru-page-wrap input::-webkit-outer-spin-button,
  .booru-page-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .booru-page-btn {
    width: 22px; border: 0; background: transparent; color: var(--text-dim);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
  }
  .booru-page-btn:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,0.06); }
  .booru-page-btn:disabled { opacity: 0.28; cursor: default; }
  #filter-mode, #booru-order {
    background: var(--card-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; font-size: 12px;
  }
  #booru-cheat {
    font-size: 12px; color: var(--accent, #6af); text-decoration: none; white-space: nowrap;
    margin-right: auto;
  }
  #booru-cheat:hover { text-decoration: underline; }
  /* display:contents 会盖掉 [hidden]，用 class 切换 */
  .toolbar-group { display: contents; }
  .toolbar-group.is-off { display: none !important; }

  .booru-preview {
    position: fixed; inset: 0; z-index: 500;
    display: none; align-items: stretch; justify-content: center;
    background: rgba(6, 8, 14, 0.82);
    padding: 20px;
    gap: 16px;
  }
  .booru-preview.show { display: flex; }
  .booru-preview-stage {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; justify-content: center;
    background: #05070d; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden;
  }
  .booru-preview-stage img {
    max-width: 100%; max-height: calc(100vh - 40px);
    object-fit: contain; display: block;
  }
  .booru-preview-side {
    flex: 0 0 min(340px, 36vw);
    display: flex; flex-direction: column; gap: 10px;
    max-height: calc(100vh - 40px); overflow: hidden;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .booru-preview-meta {
    font-size: 12px; color: var(--text-dim); line-height: 1.5;
  }
  .booru-preview-meta b { color: var(--text); }
  .booru-preview-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .booru-preview-tags {
    flex: 1; overflow: auto; display: flex; flex-wrap: wrap; gap: 6px;
    align-content: flex-start; padding-top: 4px;
  }
  .booru-tag-chip {
    font-size: 11px; line-height: 1.3;
    padding: 3px 8px; border-radius: 4px;
    background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); cursor: pointer;
    max-width: 100%; word-break: break-all;
  }
  .booru-tag-chip:hover { border-color: var(--accent); color: #fff; }
  .bili-preview-text {
    flex: 1 0 100%;
    font-size: 12px; line-height: 1.7; color: var(--text);
    white-space: pre-wrap; word-break: break-word;
  }

  .booru-extra-dlg {
    position: fixed; inset: 0; z-index: 520;
    display: none; align-items: center; justify-content: center;
    background: rgba(6, 8, 14, 0.72); padding: 16px;
  }
  .booru-extra-dlg.show { display: flex; }
  .booru-extra-panel {
    width: min(520px, 94vw); background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .booru-extra-panel h3 {
    margin: 0; font-size: 14px; font-weight: 600; color: var(--text);
  }
  .booru-extra-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-dim);
  }
  .booru-extra-row[hidden] { display: none !important; }
  .booru-extra-row > span.label { min-width: 2.5em; color: var(--text-dim); }
  .booru-extra-row input[type="number"],
  .booru-extra-row input[type="text"],
  .booru-extra-row input[type="date"] {
    background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px; font-size: 12px;
  }
  .booru-extra-row input[type="number"] { width: 5.5rem; }
  .booru-extra-row input[type="date"] { width: 9.2rem; }
  .booru-extra-row input[type="text"] { flex: 1; min-width: 8rem; }
  .booru-rate-chip {
    font-size: 11px; padding: 4px 10px; border-radius: 4px;
    border: 1px solid var(--border); background: #0a1a30; color: var(--text);
    cursor: pointer;
  }
  .booru-rate-chip.on { border-color: var(--accent); background: #132a4a; color: #fff; }
  .booru-extra-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; margin-top: 4px; }
  .booru-batch-progress {
    flex-direction: column; align-items: stretch; gap: 6px;
  }
  .booru-batch-progress .job-progress {
    width: 100%; padding: 0; border: 0; background: transparent;
  }
  .booru-batch-progress .job-progress:not([hidden]) {
    display: flex;
  }
  #btn-booru-extra { position: relative; }
  #btn-booru-extra.has-extra { border-color: var(--accent); color: #9cf; }
  .booru-extra-badge {
    position: absolute; top: -5px; right: -6px;
    min-width: 15px; height: 15px; padding: 0 4px;
    border-radius: 8px; background: var(--accent, #4a8);
    color: #061018; font-size: 10px; font-weight: 700;
    line-height: 15px; text-align: center;
    pointer-events: none;
  }
  .booru-extra-badge:empty { display: none; }

  /* 工具栏内的批量进度条：独占一整行 */
  #booru-batch-bar:not([hidden]) {
    width: 100%; flex-basis: 100%;
    border-bottom: none;
    padding-top: 2px; padding-bottom: 2px;
  }

  @media (max-width: 860px) {
    .booru-preview { flex-direction: column; }
    .booru-preview-side { flex: 0 0 auto; max-height: 40vh; width: 100%; }
    .booru-preview-stage img { max-height: 50vh; }
  }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>

<div class="toolbar">
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;">
    来源
    <select id="filter-mode">
      <option value="local">本地</option>
      <option value="gelbooru">Gelbooru</option>
      <option value="danbooru">Danbooru</option>
      <option value="bilibili">Bilibili</option>
    </select>
  </label>
  <span class="sep"></span>
  <span class="status-seg">已收录 <b id="stat-kept">0</b></span>
  <span class="status-seg" id="stat-loaded-wrap" hidden>已加载 <b id="stat-loaded">0</b></span>
  <span class="status-seg" id="stat-selected-wrap">已选择 <b id="stat-selected">0</b></span>
  <span class="status-seg" id="stat-trashed-wrap">回收站 <b id="stat-trashed">0</b></span>
  <span class="sep"></span>

  <div id="toolbar-booru" class="toolbar-group is-off">
    <input type="text" id="booru-tags" placeholder="标签，空格分隔" spellcheck="false">
    <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;">
      排序
      <select id="booru-order">
        <option value="">默认</option>
        <option value="score">分数</option>
        <option value="id">ID 新→旧</option>
        <option value="id_asc">ID 旧→新</option>
      </select>
    </label>
    <button type="button" class="btn" id="btn-booru-extra" title="评级、分数、分辨率等">条件<span class="booru-extra-badge" aria-hidden="true"></span></button>
    <input type="hidden" id="booru-extra" value="">
    <button class="btn green" id="btn-booru-search" type="button">搜索</button>
    <button class="btn" id="btn-booru-batch" type="button" title="按当前搜索结果批量下载">批量下载</button>
    <span class="sep"></span>
  </div>

  <div id="toolbar-bilibili" class="toolbar-group is-off">
    <input type="text" id="bilibili-uid" placeholder="B站 UID" spellcheck="false">
    <select id="bilibili-type">
      <option value="">全部类型</option>
      <option value="image">图片</option>
      <option value="video">视频</option>
      <option value="forward">转发</option>
    </select>
    <input type="text" id="bilibili-keyword" placeholder="关键词" spellcheck="false">
    <label class="bili-time-row" title="发布时间区间">
      时间
      <input type="date" id="bilibili-time-from">
      <span>~</span>
      <input type="date" id="bilibili-time-to">
    </label>
    <button class="btn green" id="btn-bilibili-search" type="button">搜索</button>
    <button class="btn" id="btn-bilibili-batch" type="button" title="按当前筛选批量下载">批量下载</button>
    <span class="sep"></span>
  </div>

  <label class="toolbar-group is-off bili-time-row" id="remote-page-wrap" title="当前页；两侧可加载上/下一页">
    页
    <span class="booru-page-wrap">
      <button type="button" class="booru-page-btn" id="btn-booru-page-prev" title="上一页" disabled>‹</button>
      <input type="number" id="booru-start-page" min="1" max="10000" value="1" step="1">
      <button type="button" class="booru-page-btn" id="btn-booru-page-next" title="下一页" disabled>›</button>
    </span>
  </label>

  <div id="toolbar-local" class="toolbar-group">
    <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;">
      排序
      <select id="sort-by">
        <option value="name">名称</option>
        <option value="aesthetic">美学</option>
        <option value="quality">质量</option>
        <option value="pixels">像素</option>
      </select>
    </label>
    <span class="sep"></span>
    <button class="btn" id="btn-select-all" title="Ctrl+A">全选</button>
    <button class="btn" id="btn-deselect-all" title="Ctrl+Shift+A">取消全选</button>
    <button class="btn" id="btn-invert" title="Ctrl+I">反选</button>
    <span class="sep"></span>
    <button class="btn danger" id="btn-apply" title="Delete">删除</button>
    <button class="btn green" id="btn-restore" title="Ctrl+Z">恢复</button>
    <span class="sep"></span>
    <label style="font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;">
      <input type="checkbox" id="chk-show-trash"> 显示回收站
    </label>
    <span class="sep"></span>
  </div>

  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;">
    列数 <input type="range" id="cols-slider" min="0" max="16" value="0" step="1" style="width:90px;">
    <span id="cols-label">自动</span>
  </label>

  <div class="job-progress compact" id="booru-batch-bar" hidden>
    <div class="job-progress-meta">
      <span class="job-progress-label" id="booru-batch-bar-label">批量下载</span>
      <span class="job-progress-pct" id="booru-batch-bar-pct">0%</span>
    </div>
    <div class="job-progress-track">
      <div class="job-progress-fill" id="booru-batch-bar-fill"></div>
    </div>
    <div class="job-progress-text" id="booru-batch-bar-text">-</div>
  </div>
</div>

<div class="masonry" id="masonry"></div>
<div class="toast" id="toast"></div>
<div class="hint" id="filter-hint">点击选中 · 右键相似 · Delete 删除</div>

<div class="booru-preview" id="booru-preview">
  <div class="booru-preview-stage">
    <img id="booru-preview-img" alt="">
  </div>
  <aside class="booru-preview-side">
    <div class="booru-preview-meta" id="booru-preview-meta"></div>
    <div class="booru-preview-actions">
      <button type="button" class="btn green" id="booru-preview-dl">下载</button>
      <a class="btn" id="booru-preview-open" href="#" target="_blank" rel="noopener">原站</a>
      <button type="button" class="btn" id="booru-preview-close">关闭</button>
    </div>
    <div class="booru-preview-tags" id="booru-preview-tags"></div>
  </aside>
</div>

<div class="booru-extra-dlg" id="booru-extra-dlg" aria-hidden="true">
  <div class="booru-extra-panel" role="dialog" aria-labelledby="booru-extra-title">
    <h3 id="booru-extra-title">附加条件</h3>
    <div class="booru-extra-row">
      <span class="label">评级</span>
      <button type="button" class="booru-rate-chip on" data-rate="">不限</button>
      <button type="button" class="booru-rate-chip" data-rate="g" title="General">全年龄</button>
      <button type="button" class="booru-rate-chip" data-rate="s" title="Sensitive">敏感</button>
      <button type="button" class="booru-rate-chip" data-rate="q" title="Questionable">可疑</button>
      <button type="button" class="booru-rate-chip" data-rate="e" title="Explicit">露骨</button>
    </div>
    <div class="booru-extra-row">
      <span class="label">分数</span>
      <input type="number" data-ex="scoreLo" step="1" placeholder="下限">
      <span>≤ 分数 ≤</span>
      <input type="number" data-ex="scoreHi" step="1" placeholder="上限">
    </div>
    <div class="booru-extra-row">
      <span class="label">宽度</span>
      <input type="number" data-ex="widthLo" min="0" step="1" placeholder="下限">
      <span>≤ 宽 ≤</span>
      <input type="number" data-ex="widthHi" min="0" step="1" placeholder="上限">
    </div>
    <div class="booru-extra-row">
      <span class="label">高度</span>
      <input type="number" data-ex="heightLo" min="0" step="1" placeholder="下限">
      <span>≤ 高 ≤</span>
      <input type="number" data-ex="heightHi" min="0" step="1" placeholder="上限">
    </div>
    <div class="booru-extra-row">
      <span class="label">ID</span>
      <input type="number" data-ex="idLo" min="1" step="1" placeholder="下限">
      <span>≤ ID ≤</span>
      <input type="number" data-ex="idHi" min="1" step="1" placeholder="上限">
    </div>
    <div class="booru-extra-row" id="booru-extra-date-row" title="上传日期（仅 Danbooru）">
      <span class="label">日期</span>
      <input type="date" data-ex="dateLo">
      <span>≤ 日 ≤</span>
      <input type="date" data-ex="dateHi">
    </div>
    <div class="booru-extra-row">
      <span class="label">用户</span>
      <input type="text" data-ex="user" placeholder="上传者" spellcheck="false">
    </div>
    <div class="booru-extra-row">
      <span class="label">附加</span>
      <input type="text" data-ex="more" placeholder="其它元标签，空格分隔" spellcheck="false">
    </div>
    <div class="booru-extra-actions">
      <a id="booru-cheat" href="https://gelbooru.com/index.php?page=help&topic=cheatsheet" target="_blank" rel="noopener">cheatsheet</a>
      <button type="button" class="btn" data-ex-act="clear">清空</button>
      <button type="button" class="btn" data-ex-act="cancel">取消</button>
      <button type="button" class="btn green" data-ex-act="apply">确定</button>
    </div>
  </div>
</div>

<div class="booru-extra-dlg" id="booru-batch-dlg" aria-hidden="true">
  <div class="booru-extra-panel" role="dialog" aria-labelledby="booru-batch-title">
    <h3 id="booru-batch-title">批量下载</h3>
    <div class="booru-extra-row">
      <span class="label">数量</span>
      <input type="number" id="booru-batch-limit" min="1" max="5000" value="50" step="1" title="最多下载张数（跳过已保存；运行中可改）">
    </div>
    <div class="booru-extra-row">
      <span class="label">连接</span>
      <input type="number" id="booru-batch-conn" min="1" max="8" value="2" step="1" title="同时下载数（运行中可改）">
    </div>
    <div class="booru-extra-row">
      <span class="label">限速</span>
      <input type="number" id="booru-batch-rate" min="0" max="60" value="0" step="0.5" title="每秒最多发起几次下载，0=不限（运行中可改）">
      <span>次/秒（0=不限）</span>
    </div>
    <div class="booru-extra-row">
      <label style="font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="booru-batch-anima" checked> Anima 格式
      </label>
    </div>
    <div class="booru-extra-row">
      <label style="font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="booru-batch-meta-tags"> 下载元数据标签
      </label>
    </div>
    <div class="booru-extra-row">
      <label style="font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="booru-batch-keep-underscores"> 保留下划线
      </label>
    </div>
    <div class="booru-extra-row booru-batch-progress" id="booru-batch-progress" hidden>
      <div class="job-progress compact">
        <div class="job-progress-track">
          <div class="job-progress-fill" id="booru-batch-fill"></div>
        </div>
        <span class="job-progress-pct" id="booru-batch-pct">0%</span>
      </div>
      <span id="booru-batch-progress-text">-</span>
    </div>
    <div class="booru-extra-actions">
      <button type="button" class="btn" id="booru-batch-close">关闭</button>
      <button type="button" class="btn" id="booru-batch-regenerate" title="从 .danbooru_meta 重生成当前目录所有 txt">重生成 Caption</button>
      <button type="button" class="btn" id="booru-batch-refresh-meta" title="根据文件 ID 重新拉取 booru 元数据">刷新元数据</button>
      <button type="button" class="btn danger" id="booru-batch-stop" hidden>停止</button>
      <button type="button" class="btn green" id="booru-batch-start">开始</button>
    </div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/store.js"></script>
<script src="/static/js/masonry.js"></script>
<script src="/static/js/similar_hover.js"></script>
<script src="/static/js/booru_filter.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
