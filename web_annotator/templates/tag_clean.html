<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清洗</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .clean-main {
    flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    padding: 12px 16px 16px; gap: 10px;
  }
  .clean-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
    flex-shrink: 0;
  }
  .clean-grid label {
    display: flex; flex-direction: column; gap: 4px;
    font-size: 12px; color: var(--text-dim);
  }
  .clean-grid textarea {
    width: 100%; min-height: 88px; resize: vertical;
    background: #0a1a30; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    box-sizing: border-box;
  }
  .clean-hint {
    font-size: 11px; color: var(--text-dim); line-height: 1.45;
  }
  .clean-pony-switch {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); font-size: 13px; color: var(--text);
    cursor: pointer; user-select: none; flex-shrink: 0;
  }
  .clean-pony-switch input { width: 16px; height: 16px; accent-color: var(--accent); }
  .clean-pony-switch .clean-pony-desc {
    font-size: 11px; color: var(--text-dim); font-weight: 400;
  }
  .clean-options {
    display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
  }
  .clean-result {
    flex: 1; min-height: 0; overflow: auto;
    font-size: 12px; color: var(--text-dim);
    background: #0a1a30; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px;
    white-space: pre-wrap; font-family: ui-monospace, monospace;
  }
  .clean-result:empty::before {
    content: '预览或写入后，变更样本对比显示于此';
    color: var(--text-dim); opacity: 0.7;
  }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar">
  <button class="btn" type="button" id="btn-clean-preview">预览</button>
  <button class="btn danger" type="button" id="btn-clean-apply">写入</button>
  <span class="sep"></span>
  <span class="stat" id="clean-summary">-</span>
</div>

<div class="clean-main">
  <p class="clean-hint">
    处理所选目录旁路 <code>.txt</code>。流水线：HTML 实体还原 → 下划线规范化为空格 → 删除 → 提升重排 →（可选）写入 Pony 美学档位 → 头部前置；可选以 <code>|||</code> 分隔头部与正文。
  </p>
  <div class="clean-options">
    <label class="clean-pony-switch" title="数据源：数据集根目录 .aesthetic_scores.json">
      <input type="checkbox" id="clean-inject-pony">
      <span>写入 Pony 美学档位</span>
      <span class="clean-pony-desc">根据原始美学分映射为 score_0…score_9，置于头部前置之前；并移除既有 score_0…score_9</span>
    </label>
    <label class="clean-pony-switch">
      <input type="checkbox" id="clean-separator">
      <span>以 ||| 分隔头部与正文</span>
      <span class="clean-pony-desc">头部含：美学档位、前置标签、被提升标签；其后为其余标签</span>
    </label>
  </div>
  <div class="clean-grid">
    <label>整词删除（精确匹配）
      <textarea id="clean-drop" placeholder="tag1, tag2"></textarea>
    </label>
    <label>子串删除（另含内置 commentary、request）
      <textarea id="clean-drop-contains" placeholder="逗号或换行分隔"></textarea>
    </label>
    <label>提升至头部（仅重排已存在项）
      <textarea id="clean-promote" placeholder="1girl, solo"></textarea>
    </label>
    <label>头部前置（可新增）
      <textarea id="clean-prepend" placeholder="@chen bin"></textarea>
    </label>
  </div>
  <div class="clean-result" id="clean-result"></div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/api.js"></script>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/tag_clean.js"></script>
</body>
</html>
