<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .tags-main { flex: 1; display: flex; min-height: 0; }
  .tags-content {
    flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  }
  .tags-toolbar2 {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface);
    font-size: 12px; color: var(--text-dim);
  }
  .tags-toolbar2 label { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .tags-scroll { flex: 1; overflow: auto; padding: 8px 12px 20px; }
  .tag-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tag-table th {
    position: sticky; top: 0; background: var(--bg); z-index: 2;
    text-align: left; padding: 8px 10px; color: var(--text-dim); font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .tag-table td { padding: 6px 10px; border-bottom: 1px solid rgba(42,42,74,0.6); vertical-align: middle; }
  .tag-table tr:hover td { background: rgba(15,52,96,0.35); }
  .tag-table tr.selected td { background: rgba(233,69,96,0.18); }
  .tag-table .col-check { width: 36px; }
  .tag-table .col-pct { width: 88px; color: #5eb8ff; font-variant-numeric: tabular-nums; }
  .tag-table .col-count { width: 64px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .tag-table .col-en { width: 42%; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tag-table .col-zh { color: #e8d5b7; }
  .tag-table .zh-miss { color: var(--text-dim); opacity: 0.55; }
  .export-box {
    padding: 8px 14px; border-top: 1px solid var(--border); background: var(--surface);
    display: flex; gap: 8px; align-items: flex-start;
  }
  .export-box textarea {
    flex: 1; min-height: 52px; max-height: 120px; resize: vertical;
    background: #0a1a30; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; font-family: ui-monospace, monospace;
  }
  .empty-hint { padding: 40px; text-align: center; color: var(--text-dim); }

  /* 自动生成（打标）对话框：通用结构(遮罩/面板/头部/底部)复用公共 .modal 组件 */

  /* 打标操作行（置信度/选项/状态），及日志等 tag 特有样式 */
  .tagging-panel-actions {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px 10px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .tagging-panel-actions label {
    display: flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--text-dim); cursor: pointer; user-select: none;
  }
  .tagging-panel-actions input[type="number"] {
    width: 56px; background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; font-size: 12px;
  }
  .tagging-panel-actions .meta-inline {
    font-size: 12px; color: var(--text-dim); white-space: nowrap;
  }
  .tagging-panel-actions .meta-inline b { color: var(--text); font-weight: 600; }
  .model-warn {
    color: #e94560; font-size: 12px; padding: 4px 12px;
    border-bottom: 1px solid var(--border);
  }
  .tagging-log {
    flex: 1; overflow: auto; padding: 8px 12px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.45; color: #c8d4e0; white-space: pre-wrap;
  }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar">
  <span class="stat" id="stat-summary">-</span>
  <span class="sep"></span>
  <button class="btn green" id="btn-auto-tag" type="button">自动生成</button>
  <button class="btn green" id="btn-batch-add" type="button">批量添加</button>
  <button class="btn green" id="btn-batch-replace" type="button">批量替换</button>
  <button class="btn green" id="btn-batch-delete" type="button">批量删除</button>
  <button class="btn" id="btn-stats-options" type="button">条件</button>
  <button class="btn green" id="btn-refresh">统计</button>
  <button class="btn" id="btn-translate-missing">翻译缺失</button>
  <button class="btn" id="btn-export-en">导出英文</button>
  <button class="btn" id="btn-export-zh">导出中文</button>
</div>

<div class="tags-main">
  <div class="tags-content">
    <div class="tags-toolbar2">
      <span id="sel-count">已选 0</span>
    </div>
    <div class="tags-scroll">
      <table class="tag-table" id="tag-table">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="chk-head" title="全选列表"></th>
            <th class="col-pct">占比</th>
            <th class="col-count">次数</th>
            <th class="col-en">英文</th>
            <th class="col-zh">中文</th>
          </tr>
        </thead>
        <tbody id="tag-body">
          <tr><td colspan="5" class="empty-hint">加载中…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="export-box">
      <textarea id="export-text" readonly placeholder="已选标签"></textarea>
      <button class="btn green" id="btn-copy-box" type="button">复制</button>
    </div>
  </div>
</div>

<div class="modal" id="tagging-modal" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-labelledby="tagging-title">
    <div class="modal-head">
      <span class="modal-title" id="tagging-title">自动生成</span>
    </div>
    <div class="tagging-panel-actions">
      <label>置信度
        <input type="number" id="threshold" value="0.1" min="0" max="1" step="0.01">
      </label>
      <label>画师
        <input type="text" id="artist-tag" placeholder="@画师名" spellcheck="false" style="width:120px;">
      </label>
      <label><input type="checkbox" id="chk-disable-orig" checked> 忽略已有</label>
      <label><input type="checkbox" id="chk-force"> 覆盖</label>
      <span class="sep"></span>
      <span class="stat" id="stat-status">就绪</span>
      <span class="meta-inline" id="model-info"></span>
      <span class="meta-inline"><b id="m-done">0</b>/<b id="m-total">0</b></span>
      <span class="meta-inline">跳过 <b id="m-skip">0</b></span>
      <span class="meta-inline">失败 <b id="m-fail">0</b></span>
    </div>
    <div class="job-progress compact" id="job-progress" hidden>
      <div class="job-progress-track">
        <div class="job-progress-fill" id="progress-fill"></div>
      </div>
      <span class="job-progress-pct" id="progress-pct">0%</span>
    </div>
    <div id="model-warn" class="model-warn" hidden></div>
    <div class="tagging-log" id="log-box"></div>
    <div class="modal-foot">
      <button class="btn" id="btn-cancel" type="button" disabled>取消</button>
      <button class="btn green" id="btn-start" type="button">开始</button>
      <button class="btn" id="btn-tagging-close" type="button">关闭</button>
    </div>
  </div>
</div>

<!-- 统计条件对话框 -->
<div class="modal" id="stats-options-modal" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-labelledby="stats-options-title" style="width:min(420px,92vw);height:auto;max-height:min(360px,64vh);">
    <div class="modal-head">
      <span class="modal-title" id="stats-options-title">统计条件</span>
    </div>
    <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px;font-size:12px;color:var(--text-dim);">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="opt-lower" checked> 忽略大小写</label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="opt-underscores" checked> 统一空格</label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="opt-per-sample" checked> 按图去重</label>
      </div>
      <label style="display:flex;align-items:center;gap:6px;">最少出现
        <input type="number" id="opt-min" value="1" min="1" style="width:60px;background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 4px;">
      </label>
      <div style="display:flex;align-items:center;gap:6px;">统计范围
        <select id="opt-section" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:12px;">
          <option value="all">全部</option>
          <option value="before">||| 前</option>
          <option value="after">||| 后</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn green" id="btn-stats-options-apply" type="button">确定</button>
      <button class="btn" id="btn-stats-options-close" type="button">关闭</button>
    </div>
  </div>
</div>

<!-- 批量添加对话框 -->
<div class="modal" id="batch-add-modal" aria-hidden="true">
  <div class="modal-panel" role="dialog" style="height:auto;max-height:min(480px,80vh);">
    <div class="modal-head">
      <span class="modal-title">批量添加标签</span>
    </div>
    <div style="padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;">
      <label style="font-size:12px;color:var(--text-dim);display:flex;flex-direction:column;gap:3px;">
        要添加的标签（逗号分隔）
        <input type="text" id="batch-add-tags" placeholder="tag1, tag2" style="background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px;">
      </label>
      <div style="display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--text-dim);">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;">
          <span>分隔符</span>
          <select id="batch-add-separator" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:12px;">
            <option value="keep">保留 |||</option>
            <option value="add">添加 |||</option>
            <option value="remove">删除 |||</option>
          </select>
          <span>位置</span>
          <select id="batch-add-position" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:12px;">
            <option value="before">||| 之前</option>
            <option value="after">||| 之后</option>
          </select>
          <span>方式</span>
          <select id="batch-add-mode" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:12px;">
            <option value="top">置顶</option>
            <option value="bottom">置底</option>
            <option value="random">随机</option>
          </select>
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;">
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" id="batch-add-conditional"> 仅当已有匹配标签时才插入</label>
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" id="batch-add-keep-dup"> 插入前不移除已有同名标签</label>
        </div>
        <div id="batch-add-match-mode-wrap" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);opacity:.5;padding-left:18px;">
          <span>匹配方式</span>
          <select id="batch-add-match-mode" disabled style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:12px;">
            <option value="exact">精确</option>
            <option value="danbooru">Danbooru 通配(*)</option>
            <option value="regex">正则</option>
          </select>
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;">
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" id="batch-add-inject-pony"> 注入美学档位</label>
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" id="batch-add-inject-quality"> 注入质量标签</label>
        </div>
      </div>
      <div id="batch-add-result" style="font-size:12px;color:var(--text-dim);background:#0a1a30;border:1px solid var(--border);border-radius:6px;padding:8px 10px;max-height:180px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" type="button" id="btn-batch-add-preview">预览</button>
      <button class="btn danger" type="button" id="btn-batch-add-apply">写入</button>
      <button class="btn" id="btn-batch-add-close" type="button">关闭</button>
    </div>
  </div>
</div>

<!-- 批量删除对话框 -->
<div class="modal" id="batch-delete-modal" aria-hidden="true">
  <div class="modal-panel" role="dialog" style="height:auto;max-height:min(400px,70vh);">
    <div class="modal-head">
      <span class="modal-title">批量删除标签</span>
    </div>
    <div style="padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;">
      <label style="font-size:12px;color:var(--text-dim);display:flex;flex-direction:column;gap:3px;">
        要删除的标签（逗号分隔）
        <input type="text" id="batch-delete-tags" placeholder="tag1, tag2" style="background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px;">
      </label>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--text-dim);">
        <span>匹配方式</span>
        <select id="batch-delete-mode" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:12px;">
          <option value="exact">精确</option>
          <option value="danbooru">Danbooru 通配(*)</option>
          <option value="regex">正则</option>
        </select>
        <span style="opacity:.75;">通配: * 匹配任意字符；正则作用于归一化标签(小写无下划线)</span>
      </div>
      <div id="batch-delete-result" style="font-size:12px;color:var(--text-dim);background:#0a1a30;border:1px solid var(--border);border-radius:6px;padding:8px 10px;max-height:180px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" type="button" id="btn-batch-delete-preview">预览</button>
      <button class="btn danger" type="button" id="btn-batch-delete-apply">写入</button>
      <button class="btn" id="btn-batch-delete-close" type="button">关闭</button>
    </div>
  </div>
</div>

<!-- 批量替换对话框 -->
<div class="modal" id="batch-replace-modal" aria-hidden="true">
  <div class="modal-panel" role="dialog" style="height:auto;max-height:min(420px,72vh);">
    <div class="modal-head">
      <span class="modal-title">批量替换标签</span>
    </div>
    <div style="padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;">
      <div style="display:flex;gap:10px;align-items:flex-start;">
        <label style="font-size:12px;color:var(--text-dim);display:flex;flex-direction:column;gap:3px;flex:1;">
          原标签（逗号分隔）
          <input type="text" id="batch-replace-from" placeholder="tag1, tag2" style="background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px;">
        </label>
        <label style="font-size:12px;color:var(--text-dim);display:flex;flex-direction:column;gap:3px;flex:1;">
          新标签（逗号分隔，按顺序对应）
          <input type="text" id="batch-replace-to" placeholder="new1, new2" style="background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px;">
        </label>
      </div>
      <div style="font-size:12px;color:var(--text-dim);">原位置替换：原标签出现的位置改写为新标签，替换后整体去重。两个列表按顺序一一配对。</div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--text-dim);">
        <span>原标签匹配方式</span>
        <select id="batch-replace-mode" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:12px;">
          <option value="exact">精确</option>
          <option value="danbooru">Danbooru 通配(*)</option>
          <option value="regex">正则</option>
        </select>
        <span style="opacity:.75;">通配: * 匹配任意字符；正则作用于归一化标签(小写无下划线)</span>
      </div>
      <div id="batch-replace-result" style="font-size:12px;color:var(--text-dim);background:#0a1a30;border:1px solid var(--border);border-radius:6px;padding:8px 10px;max-height:180px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" type="button" id="btn-batch-replace-preview">预览</button>
      <button class="btn danger" type="button" id="btn-batch-replace-apply">写入</button>
      <button class="btn" id="btn-batch-replace-close" type="button">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/js/ui.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/tagging.js"></script>
<script src="/static/js/tags.js"></script>
</body>
</html>
