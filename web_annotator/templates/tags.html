<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .tags-main { flex: 1; display: flex; min-height: 0; }
  .tags-content {
    flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  }
  .tags-toolbar2 {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface);
    font-size: 12px; color: var(--text-dim);
  }
  .tags-toolbar2 label { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .tags-scroll { flex: 1; overflow: auto; padding: 8px 12px 20px; }
  .tag-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tag-table th {
    position: sticky; top: 0; background: var(--bg); z-index: 2;
    text-align: left; padding: 8px 10px; color: var(--text-dim); font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .tag-table td { padding: 6px 10px; border-bottom: 1px solid rgba(42,42,74,0.6); vertical-align: middle; }
  .tag-table tr:hover td { background: rgba(15,52,96,0.35); }
  .tag-table tr.selected td { background: rgba(233,69,96,0.18); }
  .tag-table .col-check { width: 36px; }
  .tag-table .col-pct { width: 88px; color: #5eb8ff; font-variant-numeric: tabular-nums; }
  .tag-table .col-count { width: 64px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .tag-table .col-en { width: 42%; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tag-table .col-zh { color: #e8d5b7; }
  .tag-table .zh-miss { color: var(--text-dim); opacity: 0.55; }
  .export-box {
    padding: 8px 14px; border-top: 1px solid var(--border); background: var(--surface);
    display: flex; gap: 8px; align-items: flex-start;
  }
  .export-box textarea {
    flex: 1; min-height: 52px; max-height: 120px; resize: vertical;
    background: #0a1a30; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; font-family: ui-monospace, monospace;
  }
  .empty-hint { padding: 40px; text-align: center; color: var(--text-dim); }

  /* 自动生成（打标）对话框 */
  .tagging-modal {
    display: none; position: fixed; inset: 0; z-index: 400;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55);
  }
  .tagging-modal.open { display: flex; }
  .tagging-panel {
    width: min(920px, 94vw); height: min(720px, 88vh);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .tagging-panel-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .tagging-panel-head .title {
    font-size: 14px; font-weight: 600; margin-right: 4px;
  }
  .tagging-panel-head label {
    display: flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--text-dim); cursor: pointer; user-select: none;
  }
  .tagging-panel-head input[type="number"] {
    width: 56px; background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; font-size: 12px;
  }
  .tagging-panel-head .meta-inline {
    font-size: 12px; color: var(--text-dim); white-space: nowrap;
  }
  .tagging-panel-head .meta-inline b { color: var(--text); font-weight: 600; }
  .tagging-panel-head .spacer { flex: 1; min-width: 8px; }
  .model-warn {
    color: #e94560; font-size: 12px; padding: 4px 12px;
    border-bottom: 1px solid var(--border);
  }
  .tagging-log {
    flex: 1; overflow: auto; padding: 8px 12px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.45; color: #c8d4e0; white-space: pre-wrap;
  }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar">
  <span class="stat" id="stat-summary">-</span>
  <span class="sep"></span>
  <button class="btn green" id="btn-auto-tag" type="button">自动生成</button>
  <button class="btn green" id="btn-batch-edit" type="button">批量编辑</button>
  <button class="btn green" id="btn-refresh">统计</button>
  <button class="btn" id="btn-translate-missing">翻译缺失</button>
  <button class="btn" id="btn-select-all-tags">全选</button>
  <button class="btn" id="btn-clear-tags">清空</button>
  <button class="btn" id="btn-copy">复制</button>
  <button class="btn" id="btn-export-en">导出英文</button>
  <button class="btn" id="btn-export-zh">导出中文</button>
</div>

<div class="tags-main">
  <div class="tags-content">
    <div class="tags-toolbar2">
      <label><input type="checkbox" id="opt-lower" checked> 忽略大小写</label>
      <label><input type="checkbox" id="opt-underscores" checked> 统一空格</label>
      <label><input type="checkbox" id="opt-per-sample" checked> 按图去重</label>
      <label>最少出现 <input type="number" id="opt-min" value="1" min="1" style="width:52px;background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 4px;"></label>
      <span id="sel-count">已选 0</span>
    </div>
    <div class="tags-scroll">
      <table class="tag-table" id="tag-table">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="chk-head" title="全选列表"></th>
            <th class="col-pct">占比</th>
            <th class="col-count">次数</th>
            <th class="col-en">英文</th>
            <th class="col-zh">中文</th>
          </tr>
        </thead>
        <tbody id="tag-body">
          <tr><td colspan="5" class="empty-hint">加载中…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="export-box">
      <textarea id="export-text" readonly placeholder="已选标签"></textarea>
      <button class="btn green" id="btn-copy-box" type="button">复制</button>
    </div>
  </div>
</div>

<div class="tagging-modal" id="tagging-modal" aria-hidden="true">
  <div class="tagging-panel" role="dialog" aria-labelledby="tagging-title">
    <div class="tagging-panel-head">
      <span class="title" id="tagging-title">自动生成</span>
      <button class="btn green" id="btn-start" type="button">开始</button>
      <button class="btn" id="btn-cancel" type="button" disabled>取消</button>
      <span class="sep"></span>
      <label>置信度
        <input type="number" id="threshold" value="0.1" min="0" max="1" step="0.01">
      </label>
      <label><input type="checkbox" id="chk-disable-orig" checked> 忽略已有</label>
      <label><input type="checkbox" id="chk-force" checked> 覆盖</label>
      <span class="sep"></span>
      <span class="stat" id="stat-status">就绪</span>
      <span class="meta-inline" id="model-info"></span>
      <span class="meta-inline"><b id="m-done">0</b>/<b id="m-total">0</b></span>
      <span class="meta-inline">跳过 <b id="m-skip">0</b></span>
      <span class="meta-inline">失败 <b id="m-fail">0</b></span>
      <span class="spacer"></span>
      <button class="btn" id="btn-tagging-close" type="button">关闭</button>
    </div>
    <div class="job-progress compact" id="job-progress" hidden>
      <div class="job-progress-track">
        <div class="job-progress-fill" id="progress-fill"></div>
      </div>
      <span class="job-progress-pct" id="progress-pct">0%</span>
    </div>
    <div id="model-warn" class="model-warn" hidden></div>
    <div class="tagging-log" id="log-box"></div>
  </div>
</div>

<!-- 批量编辑对话框 -->
<div class="tagging-modal" id="batch-edit-modal" aria-hidden="true">
  <div class="tagging-panel" role="dialog" aria-labelledby="batch-edit-title" style="height:auto;max-height:min(520px,80vh);">
    <div class="tagging-panel-head">
      <span class="title" id="batch-edit-title">批量编辑标签</span>
      <span class="spacer"></span>
      <button class="btn" id="btn-batch-edit-close" type="button">关闭</button>
    </div>
    <div style="padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <label style="flex:1;min-width:140px;font-size:12px;color:var(--text-dim);display:flex;flex-direction:column;gap:3px;">
          删除标签（逗号分隔）
          <input type="text" id="batch-delete" placeholder="tag1, tag2" style="background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px;">
        </label>
        <label style="flex:1;min-width:140px;font-size:12px;color:var(--text-dim);display:flex;flex-direction:column;gap:3px;">
          添加标签（逗号分隔）
          <input type="text" id="batch-add" placeholder="tag1, tag2" style="background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px;">
        </label>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:12px;color:var(--text-dim);">
        <span>放在</span>
        <select id="batch-position" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:12px;">
          <option value="after">||| 之后</option>
          <option value="before">||| 之前</option>
        </select>
        <span>插入方式</span>
        <select id="batch-mode" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:12px;">
          <option value="bottom">置底</option>
          <option value="top">置顶</option>
          <option value="random">随机</option>
        </select>
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" id="batch-conditional"> 仅当已有同名标签时</label>
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" id="batch-keep-dup"> 不删除已有重复</label>
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" id="batch-inject-pony"> 注入 Pony 美学档位（最前）</label>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn" type="button" id="btn-batch-preview">预览</button>
        <button class="btn danger" type="button" id="btn-batch-apply">写入</button>
      </div>
      <div id="batch-edit-result" style="font-size:12px;color:var(--text-dim);background:#0a1a30;border:1px solid var(--border);border-radius:6px;padding:8px 10px;max-height:180px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace;"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/js/api.js"></script>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/tagging.js"></script>
<script src="/static/js/tags.js"></script>
</body>
</html>
