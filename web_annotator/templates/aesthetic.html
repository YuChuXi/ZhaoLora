<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美学</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .aes-main { flex: 1; display: flex; min-height: 0; }
  .aes-content {
    flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  }
  .opts {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface);
    font-size: 12px; color: var(--text-dim);
  }
  .opts label { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .opts select {
    background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px;
  }
  .progress-meta {
    padding: 8px 14px; font-size: 12px; color: var(--text-dim);
    display: flex; gap: 14px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .progress-meta b { color: var(--text); font-weight: 600; }
  .report-frame {
    flex: 1; width: 100%; border: 0; background: #0d0d1a; min-height: 0;
  }
  .report-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 14px; background: #0a101c;
  }
  .report-empty[hidden] { display: none; }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar">
  <button class="btn green" id="btn-start">开始</button>
  <button class="btn" id="btn-cancel" disabled>取消</button>
  <span class="sep"></span>
  <span class="stat" id="stat-status">就绪</span>
</div>

<div class="job-progress" id="job-progress">
  <div class="job-progress-track">
    <div class="job-progress-fill aes" id="progress-fill"></div>
  </div>
  <span class="job-progress-pct" id="progress-pct">0%</span>
  <span class="job-progress-meta" id="progress-meta-line">待命</span>
</div>

<div class="aes-main">
  <div class="aes-content">
    <div class="opts">
      <label>设备
        <select id="device">
          <option value="cpu">CPU</option>
          <option value="cuda">CUDA</option>
        </select>
      </label>
    </div>
    <div class="progress-meta">
      <span>进度 <b id="m-done">0</b>/<b id="m-total">0</b></span>
      <span>完成 <b id="m-ok">0</b></span>
      <span>失败 <b id="m-fail">0</b></span>
      <span id="m-current" style="flex:1;min-width:120px;"></span>
    </div>
    <div class="report-empty" id="report-empty">暂无报告</div>
    <iframe class="report-frame" id="report-frame" title="美学报告" hidden></iframe>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/aesthetic.js"></script>
</body>
</html>
