<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务 · ZhaoLora 标注工具</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .home-shell { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .docs-side {
    width: 200px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .side-tasks {
    display: block; margin: 12px 8px 4px; padding: 9px 10px; border-radius: 6px;
    font-size: 14px; font-weight: 600; color: var(--text-dim); text-decoration: none;
  }
  .side-tasks:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .side-tasks.active {
    background: rgba(233,69,96,0.16); color: var(--text);
  }
  .docs-side-head {
    padding: 14px 14px 8px; font-size: 12px; color: var(--text-dim); font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .docs-nav { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  .docs-nav a {
    display: block; padding: 7px 10px; border-radius: 6px;
    font-size: 13px; color: var(--text-dim); text-decoration: none;
  }
  .docs-nav a:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .docs-nav a.active {
    background: rgba(233,69,96,0.16); color: var(--text); font-weight: 600;
  }
  .home-main { flex: 1; min-width: 0; overflow-y: auto; padding: 28px 32px 72px; }
  .home-pane { max-width: 1280px; margin: 0 auto; }
  .home-pane[hidden] { display: none !important; }
  .home-pane h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px; color: var(--text); }
  .home-lead { font-size: 14px; color: var(--text-dim); margin: 0 0 24px; line-height: 1.55; max-width: 52em; }
  .task-add { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; align-items: center; }
  .task-input-wrap { position: relative; flex: 1; min-width: 220px; max-width: 360px; }
  .task-add input {
    width: 100%; box-sizing: border-box; padding: 10px 12px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px;
  }
  .task-suggest {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin-top: 4px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    max-height: 240px; overflow-y: auto; display: none;
  }
  .task-suggest.open { display: block; }
  .task-suggest button {
    display: block; width: 100%; text-align: left; padding: 10px 12px;
    background: transparent; border: 0; color: var(--text); font-size: 14px; cursor: pointer;
  }
  .task-suggest button:hover, .task-suggest button.active { background: rgba(233,69,96,0.16); }
  .task-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px; margin-bottom: 16px;
  }
  .task-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    position: relative;
  }
  .task-card:hover {
    border-color: #4a6a9a;
    box-shadow: 0 10px 28px rgba(0,0,0,0.28);
  }
  .task-card.drag-over {
    border-color: #e94560; box-shadow: 0 0 0 2px rgba(233,69,96,0.35);
    transform: scale(1.015);
  }
  .task-card.dragging { opacity: 0.4; transform: scale(0.97); }
  .task-card.sortable { cursor: grab; }
  .task-card.sortable:active { cursor: grabbing; }
  .task-drag-handle {
    position: absolute; top: 8px; right: 8px; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 16px; opacity: 0; transition: opacity 0.15s;
    pointer-events: none;
  }
  .task-card.sortable:hover .task-drag-handle { opacity: 0.6; }
  .task-previews {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: #060a12;
  }
  .task-previews img, .task-previews .empty-slot {
    aspect-ratio: 1 / 1; width: 100%; object-fit: cover; background: #0a101c; display: block;
  }
  .task-body {
    padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1;
  }
  .task-card h3 { margin: 0; font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: 0.01em; }
  .task-card .meta { font-size: 13px; color: var(--text-dim); }
  .task-note {
    font-size: 13px; color: var(--text-dim); line-height: 1.5;
    padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 6px;
    cursor: default; min-height: 20px; word-break: break-word;
  }
  .task-note.empty { font-style: italic; opacity: 0.45; }
  .task-note:hover { background: rgba(255,255,255,0.06); }
  .task-note-input {
    width: 100%; box-sizing: border-box; padding: 6px 10px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; font-family: inherit; line-height: 1.5;
    resize: vertical; min-height: 32px;
  }
  .task-trigger { display: flex; align-items: center; gap: 8px; }
  .task-trigger-label {
    font-size: 12px; color: var(--text-dim); flex-shrink: 0; font-weight: 600;
  }
  .task-trigger-input {
    flex: 1; min-width: 0; box-sizing: border-box; padding: 5px 10px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; font-family: inherit;
  }
  .task-trigger-input:focus { outline: none; border-color: #4a6a9a; }
  .task-trigger-copy {
    flex-shrink: 0; padding: 4px 10px; font-size: 12px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text-dim); cursor: pointer;
  }
  .task-trigger-copy:hover { color: var(--text); border-color: #4a6a9a; }
  .sort-bar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
  }
  .sort-label { font-size: 13px; color: var(--text-dim); }
  .sort-group { display: flex; gap: 4px; }
  .sort-btn {
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--text-dim); font-size: 13px; cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .sort-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .sort-btn.active {
    background: rgba(233,69,96,0.16); color: var(--text); border-color: transparent;
  }
  .task-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
  .task-actions .btn { padding: 7px 14px; font-size: 13px; }
  .task-actions .btn.green { min-width: 88px; }
  .home-empty { color: var(--text-dim); font-size: 14px; padding: 28px 0; }
  details.completed-block { margin-top: 32px; }
  details.completed-block > summary {
    cursor: pointer; color: var(--text-dim); font-size: 14px; margin-bottom: 14px;
  }
  .task-card.archiving { pointer-events: none; opacity: 0.6; }
  .task-card .job-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: rgba(233,69,96,0.15); overflow: hidden; z-index: 5;
  }
  .task-card .job-bar > div { height: 100%; background: #e94560; transition: width 0.3s; width: 0; }
  .task-card .job-msg {
    position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
    font-size: 12px; color: var(--text-dim); z-index: 5;
  }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="home-shell">
  <aside class="docs-side">
    <a class="side-tasks" id="nav-tasks" href="/">任务</a>
    <div class="docs-side-head">文档</div>
    <nav class="docs-nav" id="docs-nav"></nav>
  </aside>
  <div class="home-main">
    <div class="home-pane" id="pane-tasks">
      <h1>任务</h1>
      <p class="home-lead">手动添加任务后进入处理。未登记的子目录不会出现；输入框可补全尚未登记的目录名。</p>
      <form class="task-add" id="task-add-form" autocomplete="off">
        <div class="task-input-wrap">
          <input type="text" id="task-name" placeholder="任务目录名" required
            pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" title="字母、数字、下划线或连字符"
            aria-autocomplete="list" aria-controls="task-suggest">
          <div class="task-suggest" id="task-suggest" role="listbox"></div>
        </div>
        <button type="submit" class="btn green">添加任务</button>
      </form>
      <div class="sort-bar">
        <span class="sort-label">排序：</span>
        <div class="sort-group" id="sort-group">
          <button type="button" class="sort-btn active" data-sort="sort_order" data-order="asc">手动</button>
          <button type="button" class="sort-btn" data-sort="name" data-order="asc">名称</button>
          <button type="button" class="sort-btn" data-sort="image_count" data-order="desc">图像数</button>
          <button type="button" class="sort-btn" data-sort="created" data-order="desc">创建时间</button>
        </div>
      </div>
      <div class="task-grid" id="task-active"></div>
      <p class="home-empty" id="task-empty" hidden>尚未添加任务</p>
      <details class="completed-block" id="completed-wrap" hidden>
        <summary>已完成（<span id="completed-count">0</span>）</summary>
        <div class="task-grid" id="task-completed"></div>
      </details>
      <details class="completed-block" id="archived-wrap" hidden>
        <summary>已归档（<span id="archived-count">0</span>）</summary>
        <div class="task-grid" id="task-archived"></div>
      </details>
    </div>
    <div class="home-pane" id="pane-docs" hidden>
      <article class="docs-article" id="docs-article">
        <p class="docs-empty">加载中…</p>
      </article>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/ui.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/home.js"></script>
</body>
</html>
