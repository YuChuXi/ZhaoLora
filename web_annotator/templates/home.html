<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档 · ZhaoLora 标注工具</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .docs-shell {
    flex: 1; display: flex; min-height: 0; overflow: hidden;
  }
  .docs-side {
    width: 200px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .docs-side-head {
    padding: 14px 14px 8px; font-size: 12px; color: var(--text-dim); font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .docs-nav { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  .docs-nav a {
    display: block; padding: 7px 10px; border-radius: 6px;
    font-size: 13px; color: var(--text-dim); text-decoration: none;
  }
  .docs-nav a:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .docs-nav a.active {
    background: rgba(233,69,96,0.16); color: var(--text); font-weight: 600;
  }
  .docs-side-foot {
    padding: 10px 12px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim);
  }
  .docs-side-foot a { color: #8eb4e8; text-decoration: none; }
  .docs-side-foot a:hover { text-decoration: underline; }
  .docs-main {
    flex: 1; min-width: 0; overflow-y: auto;
    padding: 24px 28px 64px;
  }
  .docs-article {
    max-width: 820px; margin: 0 auto;
  }
  .docs-article h1 {
    font-size: 24px; font-weight: 700; margin: 0 0 14px; color: var(--text);
  }
  .docs-article h2 {
    font-size: 16px; font-weight: 600; margin: 28px 0 10px;
    color: var(--text); padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .docs-article h3 {
    font-size: 13px; font-weight: 600; margin: 18px 0 8px; color: #c8d4e0;
  }
  .docs-article p, .docs-article li {
    font-size: 13px; line-height: 1.65; color: var(--text-dim);
  }
  .docs-article ul, .docs-article ol { padding-left: 1.25em; margin: 6px 0 12px; }
  .docs-article li { margin: 3px 0; }
  .docs-article a { color: #8eb4e8; text-decoration: none; }
  .docs-article a:hover { color: var(--accent-hover); text-decoration: underline; }
  .docs-article code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; color: #d4e4f7;
    background: #0a1a30; border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px;
  }
  .docs-article pre {
    margin: 8px 0 14px; padding: 12px 14px; overflow-x: auto;
    background: #0a1a30; border: 1px solid var(--border); border-radius: 8px;
    font-size: 12px; line-height: 1.5; color: #c8d4e0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .docs-article pre code {
    background: none; border: none; padding: 0; color: inherit; font-size: inherit;
  }
  .docs-article table {
    width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-size: 13px;
  }
  .docs-article th, .docs-article td {
    text-align: left; padding: 7px 10px; vertical-align: top;
    border-bottom: 1px solid rgba(42,42,74,0.75);
  }
  .docs-article th {
    color: var(--text-dim); font-weight: 600; font-size: 12px; background: var(--surface);
  }
  .docs-article td { color: var(--text-dim); }
  .docs-article hr {
    border: none; border-top: 1px solid var(--border); margin: 24px 0;
  }
  .docs-empty { color: var(--text-dim); padding: 40px 0; }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="docs-shell">
  <aside class="docs-side">
    <div class="docs-side-head">文档</div>
    <nav class="docs-nav" id="docs-nav"></nav>
    <div class="docs-side-foot" id="docs-raw-link"></div>
  </aside>
  <div class="docs-main">
    <article class="docs-article" id="docs-article">
      <p class="docs-empty">加载中…</p>
    </article>
  </div>
</div>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/docs_home.js"></script>
</body>
</html>
