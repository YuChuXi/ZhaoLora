<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据集 · ZhaoLora 标注工具</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  .home-main {
    flex: 1; max-width: 720px; margin: 0 auto; padding: 40px 24px 64px; width: 100%; box-sizing: border-box;
  }
  .home-main h1 {
    font-size: 22px; font-weight: 700; margin: 0 0 8px; color: var(--text);
  }
  .home-main .lead {
    font-size: 13px; color: var(--text-dim); margin: 0 0 28px; line-height: 1.5;
  }
  .ds-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .ds-list a {
    display: block; padding: 14px 16px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600;
  }
  .ds-list a:hover { border-color: var(--accent); color: var(--accent-hover); }
  .ds-list .path {
    display: block; margin-top: 4px; font-size: 12px; font-weight: 400; color: var(--text-dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .home-empty { color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<main class="home-main">
  <h1>数据集</h1>
  <p class="lead">选择一个数据集进入标注。需要切换数据集时请返回本页，或新开标签页。</p>
  <ul class="ds-list" id="ds-list">
    <li class="home-empty">加载中…</li>
  </ul>
</main>
<script src="/static/js/nav.js"></script>
<script src="/static/js/datasets_home.js"></script>
</body>
</html>
