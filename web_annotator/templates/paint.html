<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蒙版</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .paint-canvas-wrap { flex: 1; overflow: hidden; position: relative; background: #222; display: flex; align-items: center; justify-content: center; }
  .paint-canvas-wrap canvas { display: block; }
  .brush-preview { position: absolute; pointer-events: none; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px #000; background: rgba(255,255,255,0.08); z-index: 10; display: none; }
  .fabric-container { width: 100%; height: 100%; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; }
  .modal-overlay[hidden] { display: none; }
  .modal-dlg { background: var(--card-bg, #2a2a2a); border-radius: 8px; padding: 24px; min-width: 300px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
  .modal-dlg h3 { margin: 0 0 16px; font-size: 16px; }
  .modal-row { display: flex; gap: 16px; margin-bottom: 16px; }
  .modal-row label { font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  .modal-row label.inline { flex-direction: row; align-items: center; gap: 6px; }
  /* 「跳过已有蒙版」是批量概念: 单图模式灰显禁用(纯 CSS 视觉), 批量模式正常 */
  .modal-row:has(#birefnet-batch:not(:checked)) #birefnet-skip-wrap { opacity: .5; }
  /* 选色器仅「自定义」背景时显示 */
  #bg-color { display: none; }
  #bg-style:has(option[value="custom"]:checked) ~ #bg-color { display: inline-block; }
  .modal-row input { width: 80px; background: var(--input-bg, #333); color: var(--text, #ddd); border: 1px solid var(--border, #555); border-radius: 4px; padding: 4px 8px; font-size: 13px; }
  .modal-row input[type="checkbox"] { width: auto; margin: 0; }
  .modal-row input[type="radio"] { width: auto; margin: 0; }
  .modal-row select { background: var(--input-bg, #333); color: var(--text, #ddd); border: 1px solid var(--border, #555); border-radius: 4px; padding: 4px 8px; font-size: 13px; }
  .modal-row #sam3-expression { width: 100%; min-width: 280px; box-sizing: border-box; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  /* 未确认模板实例(红色矩形, 可拖动/缩放) */
  .template-inst { position: absolute; box-sizing: border-box; border: 1.5px solid #f33; cursor: move;
    z-index: 12; display: none; user-select: none; background: transparent; }
  .template-inst canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  /* 缩放手柄: 4 角(双向)+ 4 边(单向), 均内嵌可见, 不依赖越界命中 */
  .template-inst [data-resize] { position: absolute; z-index: 3; }
  .template-inst [data-resize="nw"], .template-inst [data-resize="ne"],
  .template-inst [data-resize="sw"], .template-inst [data-resize="se"] { width: 12px; height: 12px; }
  .template-inst [data-resize="n"], .template-inst [data-resize="s"] { height: 10px; width: 46px; left: 50%; transform: translateX(-50%); }
  .template-inst [data-resize="w"], .template-inst [data-resize="e"] { width: 10px; height: 46px; top: 50%; transform: translateY(-50%); }
  .template-inst [data-resize="nw"] { left: 0; top: 0; cursor: nwse-resize; }
  .template-inst [data-resize="ne"] { right: 0; top: 0; cursor: nesw-resize; }
  .template-inst [data-resize="sw"] { left: 0; bottom: 0; cursor: nesw-resize; }
  .template-inst [data-resize="se"] { right: 0; bottom: 0; cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 40%, #f33 41%, #f33 59%, transparent 60%); }
  .template-inst [data-resize="n"] { left: 50%; transform: translateX(-50%); top: 0; cursor: ns-resize; }
  .template-inst [data-resize="s"] { left: 50%; transform: translateX(-50%); bottom: 0; cursor: ns-resize; }
  .template-inst [data-resize="w"] { top: 50%; transform: translateY(-50%); left: 0; cursor: ew-resize; }
  .template-inst [data-resize="e"] { top: 50%; transform: translateY(-50%); right: 0; cursor: ew-resize; }
  /* 框选模板捕获选区(红色虚线) */
  .capture-rect { position: absolute; box-sizing: border-box; border: 1.5px dashed #f33;
    background: rgba(255,0,0,0.15); pointer-events: none; z-index: 12; display: none; }
  /* 模板管理对话框的槽位卡片 */
  .tmpl-hint { font-size: 12px; color: var(--text-dim); }
  .tmpl-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
  .tmpl-card { border: 1px solid var(--border, #555); border-radius: 6px; padding: 6px; text-align: center;
    background: var(--input-bg, #333); position: relative; }
  .tmpl-card .key { font-size: 11px; color: var(--text-dim); }
  .tmpl-card canvas { width: 100%; height: 52px; object-fit: contain; display: block; margin: 4px 0;
    background: repeating-conic-gradient(#333 0 25%, #222 0 50%) 0 0 / 10px 10px; }
  .tmpl-card .del { position: absolute; top: 2px; right: 2px; background: transparent; border: none;
    color: var(--text-dim); cursor: pointer; font-size: 12px; line-height: 1; }
  .tmpl-card.empty { opacity: .4; }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar">
  <button class="btn" id="btn-prev" title="←/A">上一张</button>
  <button class="btn" id="btn-next" title="→/D">下一张</button>
  <button class="btn" id="btn-skip">跳过</button>
  <button class="btn green" id="btn-save">保存</button>
  <span class="sep"></span>
  <button class="btn" id="btn-birefnet-mask" title="生成蒙版(BiRefNet / SAM3)到 mask/">生成蒙版</button>
  <span class="sep"></span>
  <button class="btn" id="btn-template" title="蒙板模板管理: 框选当前图区域存模板, 1-9/0 放置, 双击应用">模板</button>
  <span class="sep"></span>
  <button class="btn" id="btn-clear">全透明</button>
  <button class="btn" id="btn-fill">全不透明</button>
  <button class="btn" id="btn-default">恢复默认</button>
  <span class="sep"></span>
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;">
    笔刷
    <input type="range" id="brush-slider" min="0.5" max="20" value="3" step="0.1" style="width:80px;">
    <span id="brush-label">3.0%</span>
  </label>
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;"
    title="左键/右键绘制 Alpha 值，⇄ 快捷交换">
    Alpha
    <input type="number" id="left-alpha" value="0" min="0" max="255" step="1" title="左键 Alpha"
      style="width:44px;background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 4px;font-size:12px;">
    <button class="btn" id="btn-swap-alpha" title="交换左右键 Alpha"
      style="padding:1px 6px;font-size:12px;line-height:1.5;">⇄</button>
    <input type="number" id="right-alpha" value="255" min="0" max="255" step="1" title="右键 Alpha"
      style="width:44px;background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 4px;font-size:12px;">
  </label>
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;">
    默认 Alpha
    <input type="number" id="default-alpha" value="255" min="0" max="255" step="1" style="width:50px;background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 4px;font-size:12px;">
  </label>
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;">
    背景
    <select id="bg-style" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 4px;font-size:12px;">
      <option value="checker" selected>棋盘格</option>
      <option value="white">纯白</option>
      <option value="black">纯黑</option>
      <option value="custom">自定义</option>
    </select>
    <input type="color" id="bg-color" value="#ffffff" title="自定义背景色"
      style="width:26px;height:22px;padding:0;border:1px solid var(--border);border-radius:4px;background:var(--card-bg);">
  </label>
</div>

<div class="job-progress compact" id="birefnet-bar" hidden>
  <div class="job-progress-meta">
    <span class="job-progress-label">蒙版生成</span>
    <span class="job-progress-pct" id="birefnet-pct">0%</span>
  </div>
  <div class="job-progress-track">
    <div class="job-progress-fill" id="birefnet-fill" style="width:0%"></div>
  </div>
  <div class="job-progress-text" id="birefnet-text">-</div>
</div>

<div class="paint-canvas-wrap" id="canvas-wrap">
  <canvas id="paint-canvas"></canvas>
  <div class="brush-preview" id="brush-preview"></div>
  <div class="template-inst" id="template-inst">
    <canvas></canvas>
    <span data-resize="nw"></span><span data-resize="n"></span><span data-resize="ne"></span>
    <span data-resize="w"></span><span data-resize="e"></span>
    <span data-resize="sw"></span><span data-resize="s"></span><span data-resize="se"></span>
  </div>
  <div class="capture-rect" id="capture-rect"></div>
</div>

<div class="modal-overlay" id="birefnet-dlg" hidden>
  <div class="modal-dlg" id="mask-dlg">
    <h3>蒙版生成</h3>
    <p style="margin:0 0 12px;font-size:12px;color:var(--text-dim);">默认仅重新生成当前图片蒙版，勾选「批量」处理整个目录。</p>
    <div class="modal-row">
      <label>生成方式<br>
        <select id="mask-mode">
          <option value="birefnet">BiRefNet 背景移除</option>
          <option value="sam3">SAM3 概念分割</option>
        </select>
      </label>
    </div>
    <!-- BiRefNet 参数区 -->
    <div id="birefnet-params">
      <div class="modal-row">
        <label>扩展像素<br><input type="number" id="birefnet-expand" value="32" min="0" max="200"></label>
        <label>收缩像素<br><input type="number" id="birefnet-shrink" value="0" min="0" max="200"></label>
      </div>
      <div class="modal-row">
        <label>最小值<br><input type="number" id="birefnet-min" value="96" min="0" max="255" step="1"></label>
        <label>最大值<br><input type="number" id="birefnet-max" value="255" min="0" max="255" step="1"></label>
      </div>
    </div>
    <!-- SAM3 参数区 -->
    <div id="sam3-params" hidden>
      <div class="modal-row">
        <label>蒙板表达式<br>
          <input type="text" id="sam3-expression" value='(当前蒙板-("白色背景"+"对话气泡"))' placeholder='(当前蒙板-("白色背景"+"对话气泡"))' title='表达式在 0-1 域运算: 数值按 0-1 书写(×255 为蒙板值, 支持任意实数, 如 0.5 半透明); 运算符 + 相加 / - 相减 / * 相乘 / min(a,b) / max(a,b) / blur(掩码,半径) 高斯模糊(平滑概念边缘) / 比较 > < >= <= == !=; 优先级 * 高于 + - 高于比较, 括号最高; 当前蒙板 为已保存蒙板, "概念文本" 为 SAM3 分割提示'>
        </label>
        <span style="font-size:12px;color:var(--text-dim);align-self:flex-end;padding-bottom:6px;">数值 ×255</span>
      </div>
      <p style="margin:0 0 12px;font-size:12px;color:var(--text-dim);">运算符 + - * / min / max / blur / 比较; 优先级 * &gt; + - &gt; 比较。悬停输入框查看完整说明。</p>
    </div>
    <div class="modal-row">
      <label class="inline"><input type="checkbox" id="birefnet-batch"> 批量处理整个目录</label>
      <label class="inline" id="birefnet-skip-wrap"><input type="checkbox" id="birefnet-skip" checked> 跳过已有蒙版</label>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" id="birefnet-cancel">取消</button>
      <button type="button" class="btn green" id="birefnet-start">开始</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="template-dlg" hidden>
  <div class="modal-dlg" style="min-width:440px;">
    <h3>蒙板模板</h3>
    <div class="modal-row">
      <label class="inline"><input type="radio" name="merge-mode" value="min" checked> min 合并</label>
      <label class="inline"><input type="radio" name="merge-mode" value="max"> max 合并</label>
      <span class="tmpl-hint">与当前蒙板按 min(默认) / max 合并</span>
    </div>
    <div class="modal-row">
      <button type="button" class="btn green" id="tmpl-capture">框选当前图区域保存为模板</button>
      <span class="tmpl-hint">快捷键 1-9/0 放置, 拖动/缩放, Shift 以中心为锚点缩放, Alt+点击加锚点(≤2)并可拖动, 双击或空格应用, Esc 取消</span>
    </div>
    <div class="tmpl-cards" id="tmpl-cards"></div>
    <div class="modal-actions">
      <button type="button" class="btn" id="tmpl-close">关闭</button>
    </div>
  </div>
</div>
<div class="filmstrip" id="filmstrip" hidden></div>
<div class="status-bar" id="paint-status">
  <span class="status-seg" id="seg-pos">0/0</span>
  <span class="status-seg" id="seg-done">已标注 0</span>
  <span class="status-seg" id="seg-name">-</span>
  <span class="status-seg" id="seg-obj">-</span>
  <span class="status-seg" id="seg-metric">-</span>
  <span class="status-seg" id="seg-extra">-</span>
</div>
<div class="toast" id="toast"></div>

<script src="/static/js/ui.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/filmstrip.js"></script>
<script src="/static/js/paint.js"></script>
</body>
</html>
