<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就绪</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .ready-main { flex: 1; display: flex; min-height: 0; }
  .ready-side {
    width: 260px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ready-side h3 {
    font-size: 13px; padding: 12px 14px 6px; color: var(--text-dim); font-weight: 600;
  }
  .dir-table-wrap { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
  .dir-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .dir-table th {
    text-align: left; font-weight: 600; color: var(--text-dim);
    font-size: 11px; padding: 4px 8px; border-bottom: 1px solid var(--border);
  }
  .dir-table td { padding: 6px 8px; color: var(--text); border-bottom: 1px solid var(--border); }
  .dir-table .mask { color: var(--text-dim); white-space: nowrap; }
  .dir-table .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .dir-table .status.ok { background: #6bcf8e; }
  .dir-table .status.none { background: #e9c46a; }
  .dir-table .empty { padding: 10px 8px; color: var(--text-dim); text-align: center; }
  .toml-box {
    flex: 1; margin: 12px 14px 14px; resize: none; min-height: 0;
    background: #0a1a30; color: #c8d4e0; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.5;
  }
  .ready-content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar">
  <button class="btn green" id="btn-gen">生成</button>
  <button class="btn" id="btn-copy">复制</button>
  <span class="sep"></span>
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;">
    num_repeats
    <input type="number" id="num-repeats" value="1" min="1" max="100" step="1"
      style="width:64px;background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;">
  </label>
  <span class="sep"></span>
  <span class="status-seg" id="stat-summary">-</span>
</div>

<div class="ready-main">
  <aside class="ready-side">
    <h3>工作目录</h3>
    <div class="dir-table-wrap">
      <table class="dir-table" id="dir-table">
        <thead>
          <tr><th>目录</th><th>张数</th><th>蒙版</th></tr>
        </thead>
        <tbody id="dir-tbody"></tbody>
      </table>
    </div>
  </aside>
  <div class="ready-content">
    <textarea class="toml-box" id="toml-box" readonly placeholder="生成后显示"></textarea>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/ui.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/ready.js"></script>
</body>
</html>
