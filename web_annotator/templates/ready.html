<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就绪</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .ready-main { flex: 1; display: flex; min-height: 0; }
  .ready-side {
    width: 280px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ready-side h3 {
    font-size: 13px; padding: 12px 14px 6px; color: var(--text-dim); font-weight: 600;
  }
  .dir-list { flex: 1; overflow-y: auto; padding: 0 14px 12px; }
  .dir-item { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .dir-item:first-child { padding-top: 2px; }
  .dir-row { display: flex; align-items: center; gap: 6px; }
  .dir-row input[type="checkbox"] { cursor: pointer; flex-shrink: 0; }
  .dir-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir-meta { color: var(--text-dim); white-space: nowrap; font-size: 11px; }
  .dir-meta .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .dir-meta .status.ok { background: #6bcf8e; }
  .dir-meta .status.none { background: #e9c46a; }
  .dir-empty { padding: 10px 2px; color: var(--text-dim); text-align: center; font-size: 12px; }
  .res-input {
    display: block; width: 100%; box-sizing: border-box; margin-top: 6px;
    background: #0a1a30; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 6px; font-size: 12px;
  }
  .toolbar .status-seg { min-width: 0; flex: 0 1 auto; }
  .mode-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .mode-seg button {
    background: transparent; color: var(--text-dim); border: none; cursor: pointer;
    padding: 4px 12px; font-size: 12px; font-family: inherit;
  }
  .mode-seg button.active { background: var(--accent); color: #fff; }
  .file-tabs { display: flex; gap: 4px; padding: 10px 14px 0; }
  .file-tab {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    cursor: pointer; padding: 4px 14px; font-size: 12px; border-radius: 6px 6px 0 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .file-tab.active { color: var(--text); background: #0a1a30; }
  .toml-box {
    flex: 1; margin: 0 14px 14px; resize: none; min-height: 0;
    background: #0a1a30; color: #c8d4e0; border: 1px solid var(--border);
    border-radius: 0 8px 8px 8px; padding: 12px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.5;
  }
  .toml-box.hidden { display: none; }
  .ready-content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar">
  <span class="mode-seg" id="mode-seg"
    title="训练模式: 画风 rank 16 / 角色 rank 32 (network_dim = network_alpha), 切换后重新生成">
    <button class="active" data-mode="style" title="画风模式: network_dim = network_alpha = 16">画风</button>
    <button data-mode="character" title="角色模式: network_dim = network_alpha = 32">角色</button>
  </span>
  <span class="sep"></span>
  <button class="btn green" id="btn-gen">生成</button>
  <button class="btn" id="btn-copy" title="复制当前标签页内容">复制</button>
  <button class="btn green" id="btn-export">导出配置</button>
  <span class="sep"></span>
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;"
    title="目标图片数: 系统据此计算 num_repeats = ceil(目标 / 实际图片数), 使重复后图片数 >= 目标">
    目标图片数
    <input type="number" id="target-images" value="512" min="1" step="1"
      style="width:72px;background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;">
  </label>
  <span class="sep"></span>
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;cursor:pointer;"
    title="启用时生成的 dataset.toml(预览与导出)附带固定正则化数据段(datasets/regL); 关闭则不包含">
    <input type="checkbox" id="use-reg" checked> 正则化
  </label>
  <span class="sep"></span>
  <span class="status-seg" id="stat-summary">-</span>
</div>

<div class="ready-main">
  <aside class="ready-side">
    <h3>工作目录 <span class="legend">img | text | mask</span></h3>
    <div class="dir-list" id="dir-list"></div>
  </aside>
  <div class="ready-content">
    <div class="file-tabs" id="file-tabs">
      <button class="file-tab active" data-file="lora.toml">lora.toml</button>
      <button class="file-tab" data-file="dataset.toml">dataset.toml</button>
      <button class="file-tab" data-file="prompt.txt">prompt.txt</button>
    </div>
    <textarea class="toml-box" id="file-lora.toml" data-file="lora.toml" spellcheck="false" placeholder="生成后显示"></textarea>
    <textarea class="toml-box hidden" id="file-dataset.toml" data-file="dataset.toml" spellcheck="false" placeholder="生成后显示"></textarea>
    <textarea class="toml-box hidden" id="file-prompt.txt" data-file="prompt.txt" spellcheck="false" placeholder="生成后显示"></textarea>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/ui.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/ready.js"></script>
</body>
</html>
