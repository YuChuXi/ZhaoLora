<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就绪</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .ready-main { flex: 1; display: flex; min-height: 0; }
  .ready-side {
    width: 260px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ready-side h3 {
    font-size: 13px; padding: 12px 14px 6px; color: var(--text-dim); font-weight: 600;
  }
  .dir-list { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
  .dir-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .dir-item:hover { background: rgba(255,255,255,0.04); }
  .dir-item .meta { color: var(--text-dim); font-size: 11px; margin-left: auto; }
  .side-actions {
    padding: 10px 12px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  .ready-content {
    flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  }
  .opts {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface);
    font-size: 12px; color: var(--text-dim);
  }
  .opts label { display: flex; align-items: center; gap: 4px; }
  .opts input[type="number"] {
    width: 64px; background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px;
  }
  .toml-box {
    flex: 1; margin: 12px 14px 14px; resize: none;
    background: #0a1a30; color: #c8d4e0; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.5;
  }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar">
  <button class="btn green" id="btn-gen">生成</button>
  <button class="btn" id="btn-copy">复制</button>
  <span class="sep"></span>
  <span class="stat" id="stat-summary">-</span>
</div>

<div class="ready-main">
  <div class="ready-content">
    <div class="opts">
      <label>num_repeats
        <input type="number" id="num-repeats" value="1" min="1" max="100" step="1">
      </label>
      <span id="root-path" style="margin-left:auto;"></span>
    </div>
    <textarea class="toml-box" id="toml-box" readonly placeholder="生成后显示"></textarea>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/api.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/ready.js"></script>
</body>
</html>
