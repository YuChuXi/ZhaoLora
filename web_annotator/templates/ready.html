<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就绪</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .ready-main { flex: 1; display: flex; min-height: 0; }
  .ready-side {
    width: 280px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ready-side h3 {
    font-size: 13px; padding: 12px 14px 6px; color: var(--text-dim); font-weight: 600;
  }
  .dir-list { flex: 1; overflow-y: auto; padding: 0 14px 12px; }
  .dir-item { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .dir-item:first-child { padding-top: 2px; }
  .dir-row { display: flex; align-items: center; gap: 6px; }
  .dir-row input[type="checkbox"] { cursor: pointer; flex-shrink: 0; }
  .dir-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir-meta { color: var(--text-dim); white-space: nowrap; font-size: 11px; }
  .dir-meta .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .dir-meta .status.ok { background: #6bcf8e; }
  .dir-meta .status.none { background: #e9c46a; }
  .dir-empty { padding: 10px 2px; color: var(--text-dim); text-align: center; font-size: 12px; }
  .res-input {
    display: block; width: 100%; box-sizing: border-box; margin-top: 6px;
    background: #0a1a30; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 6px; font-size: 12px;
  }
  .toolbar .status-seg { min-width: 0; flex: 0 1 auto; }
  .toml-box {
    flex: 1; margin: 12px 14px 14px; resize: none; min-height: 0;
    background: #0a1a30; color: #c8d4e0; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.5;
  }
  .ready-content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar">
  <button class="btn green" id="btn-gen">生成</button>
  <button class="btn" id="btn-copy">复制</button>
  <button class="btn green" id="btn-export">导出配置</button>
  <span class="sep"></span>
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;"
    title="目标图片数: 系统据此计算 num_repeats = ceil(目标 / 实际图片数), 使重复后图片数 >= 目标">
    目标图片数
    <input type="number" id="target-images" value="512" min="1" step="1"
      style="width:72px;background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;">
  </label>
  <span class="sep"></span>
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;cursor:pointer;"
    title="启用时导出的 dataset.toml 附带固定正则化数据段(datasets/regL); 关闭则不包含">
    <input type="checkbox" id="use-reg" checked> 正则化
  </label>
  <span class="sep"></span>
  <span class="status-seg" id="stat-summary">-</span>
</div>

<div class="ready-main">
  <aside class="ready-side">
    <h3>工作目录</h3>
    <div class="dir-list" id="dir-list"></div>
  </aside>
  <div class="ready-content">
    <textarea class="toml-box" id="toml-box" readonly placeholder="生成后显示"></textarea>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/ui.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/ready.js"></script>
</body>
</html>
