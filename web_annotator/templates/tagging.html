<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打标</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .tagging-main { flex: 1; display: flex; min-height: 0; }
  .tagging-side {
    width: 260px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .tagging-side h3 {
    font-size: 13px; padding: 12px 14px 6px; color: var(--text-dim); font-weight: 600;
  }
  .dir-list { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
  .dir-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .dir-item:hover { background: rgba(255,255,255,0.04); }
  .dir-item .meta { color: var(--text-dim); font-size: 11px; margin-left: auto; }
  .side-actions {
    padding: 10px 12px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  .tagging-content {
    flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  }
  .opts {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface);
    font-size: 12px; color: var(--text-dim);
  }
  .opts label { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .opts input[type="number"] {
    width: 72px; background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px;
  }
  .progress-wrap { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .progress-bar {
    height: 10px; background: #0a1a30; border-radius: 5px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #1a6fb5, #3ecf8e);
    transition: width 0.2s ease;
  }
  .progress-meta {
    margin-top: 8px; font-size: 12px; color: var(--text-dim);
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  .progress-meta b { color: var(--text); font-weight: 600; }
  .log-box {
    flex: 1; overflow: auto; padding: 10px 14px 20px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.45; color: #c8d4e0; white-space: pre-wrap;
  }
  .model-warn { color: #e94560; font-size: 12px; padding: 0 14px 8px; }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar">
  <button class="btn green" id="btn-start">开始</button>
  <button class="btn" id="btn-cancel" disabled>取消</button>
  <span class="sep"></span>
  <span class="stat" id="stat-status">就绪</span>
</div>

<div class="job-progress" id="job-progress">
  <div class="job-progress-track">
    <div class="job-progress-fill" id="progress-fill"></div>
  </div>
  <span class="job-progress-pct" id="progress-pct">0%</span>
  <span class="job-progress-meta" id="progress-meta-line">待命</span>
</div>

<div class="tagging-main">
  <div class="tagging-content">
    <div class="opts">
      <label>置信度
        <input type="number" id="threshold" value="0.1" min="0" max="1" step="0.01">
      </label>
      <label>
        <input type="checkbox" id="chk-disable-orig" checked> 忽略已有
      </label>
      <label>
        <input type="checkbox" id="chk-force" checked> 覆盖已有
      </label>
      <span id="model-info" style="margin-left:auto;"></span>
    </div>
    <div id="model-warn" class="model-warn" hidden></div>
    <div class="progress-meta" style="padding:8px 14px;font-size:12px;color:var(--text-dim);display:flex;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--border);">
      <span>进度 <b id="m-done">0</b>/<b id="m-total">0</b></span>
      <span>完成 <b id="m-ok">0</b></span>
      <span>跳过 <b id="m-skip">0</b></span>
      <span>失败 <b id="m-fail">0</b></span>
      <span id="m-current" style="flex:1;min-width:120px;"></span>
    </div>
    <div class="log-box" id="log-box"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/tagging.js"></script>
</body>
</html>
