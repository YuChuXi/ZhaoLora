<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打标</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .tagging-main { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .log-box {
    flex: 1; overflow: auto; padding: 8px 12px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.45; color: #c8d4e0; white-space: pre-wrap;
  }
  .toolbar.compact label {
    display: flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--text-dim); cursor: pointer; user-select: none;
  }
  .toolbar.compact input[type="number"] {
    width: 56px; background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; font-size: 12px;
  }
  .toolbar.compact .meta-inline {
    font-size: 12px; color: var(--text-dim); white-space: nowrap;
  }
  .toolbar.compact .meta-inline b { color: var(--text); font-weight: 600; }
  .model-warn { color: #e94560; font-size: 12px; padding: 4px 12px; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar compact">
  <button class="btn green" id="btn-start">开始</button>
  <button class="btn" id="btn-cancel" disabled>取消</button>
  <span class="sep"></span>
  <label>置信度
    <input type="number" id="threshold" value="0.1" min="0" max="1" step="0.01">
  </label>
  <label><input type="checkbox" id="chk-disable-orig" checked> 忽略已有</label>
  <label><input type="checkbox" id="chk-force" checked> 覆盖</label>
  <span class="sep"></span>
  <span class="stat" id="stat-status">就绪</span>
  <span class="meta-inline" id="model-info"></span>
  <span class="meta-inline">进度 <b id="m-done">0</b>/<b id="m-total">0</b></span>
  <span class="meta-inline">完成 <b id="m-ok">0</b></span>
  <span class="meta-inline">跳过 <b id="m-skip">0</b></span>
  <span class="meta-inline">失败 <b id="m-fail">0</b></span>
  <span class="meta-inline" id="m-current" style="flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;"></span>
</div>

<div class="job-progress compact" id="job-progress">
  <div class="job-progress-track">
    <div class="job-progress-fill" id="progress-fill"></div>
  </div>
  <span class="job-progress-pct" id="progress-pct">0%</span>
  <span class="job-progress-meta" id="progress-meta-line">待命</span>
</div>

<div id="model-warn" class="model-warn" hidden></div>

<div class="tagging-main">
  <div class="log-box" id="log-box"></div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/tagging.js"></script>
</body>
</html>
