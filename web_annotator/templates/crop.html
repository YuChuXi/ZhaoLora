<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>裁剪</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .crop-main { flex: 1; display: flex; min-height: 0; }
  .crop-canvas-wrap {
    flex: 1; overflow: hidden; position: relative; background: #222;
    cursor: crosshair;
  }
  .crop-canvas-wrap canvas { display: block; }
  .crop-side {
    width: 300px; flex-shrink: 0; background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .crop-side h3 {
    font-size: 13px; padding: 10px 12px 6px; color: var(--text-dim); font-weight: 600;
  }
  .crop-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .crop-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 10px; margin-bottom: 6px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--card-bg);
    cursor: pointer; font-size: 12px;
  }
  .crop-item:hover { border-color: #4a6a9a; }
  .crop-item.active { border-color: #00ffff; box-shadow: 0 0 0 1px #00ffff; }
  .crop-item .body { flex: 1; min-width: 0; }
  .crop-item .meta { color: var(--text-dim); margin-top: 4px; font-size: 11px; }
  .crop-item input[type="text"] {
    width: 100%; margin-top: 4px; padding: 3px 6px;
    background: #0a1a30; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; font-size: 12px;
  }
  .crop-item-actions { flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; }
  .crop-item .btn-del {
    padding: 2px 8px; font-size: 11px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); border-radius: 4px; cursor: pointer;
  }
  .crop-item .btn-del:hover { color: #fff; border-color: var(--accent); background: var(--accent); }
  .crop-item .btn-del-perm:hover { border-color: #c44; background: #c44; }
  .part-add-row { display: flex; gap: 6px; padding: 0 8px 8px; }
  .part-add-row input {
    flex: 1; padding: 4px 6px; background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; font-size: 12px;
  }
  .crop-side .side-actions {
    padding: 8px 12px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px;
  }
  .part-defaults {
    padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim);
  }
  .part-defaults label { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .part-defaults input {
    width: 110px; padding: 2px 6px; background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; font-size: 11px;
  }
  .status-bar .live { color: #5eb8ff; margin-left: 6px; }
  .toolbar { flex-wrap: nowrap; }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>
<div class="toolbar">
  <button class="btn" id="btn-prev" title="←">上一张</button>
  <button class="btn" id="btn-next" title="→">下一张</button>
  <button class="btn" id="btn-skip" title="空格">跳过</button>
  <button class="btn green" id="btn-save" title="S">保存</button>
  <span class="sep"></span>
  <button class="btn" id="btn-add-crop" title="A">新建选区</button>
  <button class="btn" id="btn-clear-crops" title="C">清空选区</button>
  <span class="sep"></span>
  <label style="font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;">
    <input type="checkbox" id="chk-no-crop"> 整图输出
  </label>
  <label id="part-name-wrap" style="font-size:12px;color:var(--text-dim);display:none;align-items:center;gap:4px;">
    部位
    <input type="text" id="part-name" placeholder="head" style="width:80px;background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:12px;">
  </label>
</div>

<div class="crop-main">
  <div class="crop-canvas-wrap" id="canvas-wrap">
    <canvas id="crop-canvas"></canvas>
  </div>
  <aside class="crop-side">
    <h3>选区</h3>
    <div class="part-add-row">
      <input type="text" id="part-add-input" placeholder="部位名">
      <button class="btn" id="btn-add-part" type="button">添加</button>
    </div>
    <div class="crop-list" id="crop-list"></div>
    <div class="part-defaults">
      <div>默认裁切（本地）</div>
      <label>全局
        <input type="text" id="crop-default-global" placeholder="1536x1536@1.0" spellcheck="false">
      </label>
      <div id="crop-default-parts"></div>
    </div>
    <div class="side-actions">
      <div id="layout-hint" style="font-size:11px;color:var(--text-dim);line-height:1.4;margin-bottom:6px;"></div>
      <div style="font-size:11px;color:var(--text-dim);line-height:1.45;">
        S 保存 · 空格跳过 · A 新建 · D 删除 · C 清空
      </div>
    </div>
  </aside>
</div>

<div class="status-bar" id="crop-status">
  <span class="status-seg" id="seg-pos">0/0</span>
  <span class="status-seg" id="seg-done">已裁 0</span>
  <span class="status-seg" id="seg-name">-</span>
  <span class="status-seg" id="seg-obj">-</span>
  <span class="status-seg" id="seg-metric">-</span>
  <span class="status-seg" id="seg-extra">选区 0<span class="live" id="live-match"></span></span>
</div>
<div class="toast" id="toast"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/crop.js"></script>
</body>
</html>
