<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>子图裁剪</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .crop-main { flex: 1; display: flex; min-height: 0; }
  .crop-canvas-wrap {
    flex: 1; overflow: hidden; position: relative; background: #222;
    cursor: crosshair;
  }
  .crop-canvas-wrap canvas { display: block; }
  .crop-side {
    width: 300px; flex-shrink: 0; background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .crop-side h3 {
    font-size: 13px; padding: 10px 12px 6px; color: var(--text-dim); font-weight: 600;
  }
  .crop-list {
    flex: 1; overflow-y: auto; padding: 0 8px 8px;
  }
  .crop-item {
    padding: 8px 10px; margin-bottom: 6px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--card-bg);
    cursor: pointer; font-size: 12px;
  }
  .crop-item:hover { border-color: #4a6a9a; }
  .crop-item.active {
    border-color: #00ffff; box-shadow: 0 0 0 1px #00ffff;
  }
  .crop-item .meta { color: var(--text-dim); margin-top: 4px; font-size: 11px; }
  .crop-item input[type="text"] {
    width: 100%; margin-top: 4px; padding: 3px 6px;
    background: #0a1a30; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; font-size: 12px;
  }
  .part-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; margin-bottom: 4px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--card-bg); font-size: 12px;
  }
  .part-item label { flex: 1; cursor: pointer; user-select: none; }
  .part-item .btn-mini {
    padding: 2px 8px; font-size: 11px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); border-radius: 4px; cursor: pointer;
  }
  .part-item .btn-mini:hover { color: var(--accent); border-color: var(--accent); }
  .crop-side .side-actions {
    padding: 8px 12px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px;
  }
  .crop-info {
    padding: 4px 12px; font-size: 12px; color: var(--text-dim);
    background: var(--surface); border-top: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .crop-info .live { color: #5eb8ff; }
</style>
</head>
<body>
<div class="toolbar">
  <span class="title">✂️ 子图裁剪</span>
  <span class="stat" id="crop-progress">0/0</span>
  <span class="stat" id="crop-filename">-</span>
  <span class="sep"></span>
  <button class="btn" id="btn-prev">← 上一张</button>
  <button class="btn" id="btn-next">下一张 →</button>
  <button class="btn" id="btn-skip">跳过</button>
  <button class="btn green" id="btn-save">💾 保存并下一张</button>
  <span class="sep"></span>
  <button class="btn" id="btn-add-crop">+ 新建选区</button>
  <button class="btn" id="btn-del-crop">删除选中</button>
  <button class="btn" id="btn-clear-crops">清空选区</button>
  <span class="sep"></span>
  <label style="font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;">
    <input type="checkbox" id="chk-no-crop"> 整图即部位（不裁切缩放）
  </label>
  <label id="part-name-wrap" style="font-size:12px;color:var(--text-dim);display:none;align-items:center;gap:4px;">
    部位
    <input type="text" id="part-name" placeholder="head" style="width:80px;background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:12px;">
  </label>
  <span class="sep"></span>
  <a class="btn" href="/" style="text-decoration:none;">筛选</a>
  <a class="btn" href="/paint" style="text-decoration:none;">绘制</a>
</div>

<div class="crop-main">
  <div class="crop-canvas-wrap" id="canvas-wrap">
    <canvas id="crop-canvas"></canvas>
  </div>
  <aside class="crop-side">
    <h3>部位（添加后勾选启用，后续自动带上）</h3>
    <div class="part-add-row" style="display:flex;gap:6px;padding:0 8px 8px;">
      <input type="text" id="part-add-input" placeholder="如 head" style="flex:1;padding:4px 6px;background:#0a1a30;color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:12px;">
      <button class="btn" id="btn-add-part" type="button">添加</button>
    </div>
    <div class="part-list" id="part-list" style="padding:0 8px 8px;max-height:140px;overflow-y:auto;"></div>
    <h3>当前选区</h3>
    <div class="crop-list" id="crop-list"></div>
    <div class="side-actions">
      <div id="layout-hint" style="font-size:11px;color:var(--text-dim);line-height:1.4;margin-bottom:6px;"></div>
      <div style="font-size:11px;color:var(--text-dim);line-height:1.4;">
        启用部位 → 每张图自动生成默认尺寸选区<br>
        命名目录：xxx/&lt;部位&gt;/同名.png<br>
        Ctrl+S 保存并下一张 · Delete 删选中
      </div>
    </div>
  </aside>
</div>

<div class="crop-info">
  <span id="info-text">加载中...</span>
  <span class="live" id="live-match"></span>
</div>
<div class="toast" id="toast"></div>

<script src="/static/js/crop.js"></script>
</body>
</html>
