<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签检查</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  #check-tag {
    background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 10px; font-size: 13px;
    width: min(260px, 30vw);
  }
  #check-position {
    background: var(--card-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px; font-size: 12px;
  }
  /* 标签补全下拉 */
  .ac-wrap { position: relative; display: inline-block; }
  .ac-popup {
    position: absolute; left: 0; top: 100%; margin-top: 2px;
    min-width: 100%; max-width: 380px;
    max-height: 340px; overflow-y: auto;
    background: #0d1b2e; border: 1px solid var(--border);
    border-radius: 4px; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    z-index: 200; font-size: 12px;
  }
  .ac-popup::-webkit-scrollbar { width: 6px; }
  .ac-popup::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  .ac-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    line-height: 1.3;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover { background: rgba(74,222,128,0.08); }
  .ac-item.ac-active { background: rgba(74,222,128,0.16); }
  .ac-tag { color: var(--text); flex: 0 1 auto; }
  .ac-tag .ac-match { color: var(--green); font-weight: 600; }
  .ac-zh { color: var(--text-dim); font-size: 11px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ac-count { color: var(--text-dim); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .ac-empty { padding: 8px 10px; color: var(--text-dim); }

  /* 单图模式 */
  .single-viewer {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    background: #0a0f18;
  }
  .single-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    font-size: 12px; color: var(--text-dim);
  }
  .single-counter { color: var(--text); font-variant-numeric: tabular-nums; min-width: 60px; }
  .single-stem { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #5eb8ff; }
  .single-canvas {
    flex: 1; min-height: 0; overflow: hidden; display: flex;
    align-items: center; justify-content: center; position: relative;
    cursor: crosshair;
  }
  .single-canvas.contain #single-img {
    object-fit: contain; max-width: 100%; max-height: 100%;
  }
  .single-canvas.cover {
    display: block; overflow-y: auto; overflow-x: hidden;
  }
  .single-canvas.cover #single-img {
    display: block; width: 100%; height: auto;
    object-fit: cover;
  }
  .single-canvas img { user-select: none; -webkit-user-drag: none; }
  .single-caption {
    padding: 6px 14px; background: var(--surface); border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-dim); font-family: ui-monospace, monospace;
    white-space: pre-wrap; max-height: 80px; overflow: auto; flex-shrink: 0;
  }
  /* 放大镜 */
  .magnifier {
    position: absolute; pointer-events: none; z-index: 50;
    border: 2px solid var(--accent); border-radius: 50%;
    box-shadow: 0 0 12px rgba(233,69,96,0.4);
    width: 180px; height: 180px;
    background-repeat: no-repeat;
    display: none;
  }
  .magnifier.show { display: block; }

  /* 单图模式位置着色 */
  .single-viewer.single-ok .single-canvas {
    box-shadow: inset 0 0 0 3px var(--green), inset 0 0 40px rgba(74,222,128,0.15);
  }
  .single-viewer.single-bad .single-canvas {
    box-shadow: inset 0 0 0 3px var(--accent), inset 0 0 40px rgba(233,69,96,0.15);
  }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>

<div class="toolbar">
  <input type="text" id="check-tag" placeholder="标签（如 1girl）" spellcheck="false">
  <select id="check-position">
    <option value="any">任意位置</option>
    <option value="before">在 ||| 前</option>
    <option value="after">在 ||| 后</option>
  </select>
  <select id="check-mode">
    <option value="top">置顶</option>
    <option value="bottom">置底</option>
    <option value="random">任意</option>
  </select>
  <button class="btn green" type="button" id="btn-check">检查</button>
  <span class="sep"></span>
  <span class="status-seg">共 <b id="stat-total">0</b></span>
  <span class="status-seg">符合 <b id="stat-ok">0</b></span>
  <span class="status-seg">不符 <b id="stat-bad">0</b></span>
  <span class="sep"></span>
  <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;">
    列数 <input type="range" id="cols-slider" min="0" max="16" value="0" step="1" style="width:90px;">
    <span id="cols-label">自动</span>
  </label>
  <span class="sep"></span>
  <button class="btn" type="button" id="btn-single-mode">单图</button>
</div>

<div class="masonry" id="masonry"></div>

<!-- 单图模式 -->
<div class="single-viewer" id="single-viewer" hidden>
  <div class="single-toolbar">
    <span class="single-counter" id="single-counter">0/0</span>
    <span class="single-stem" id="single-stem"></span>
    <button class="btn" type="button" id="btn-prev">◀</button>
    <button class="btn" type="button" id="btn-next">▶</button>
    <button class="btn" type="button" id="btn-fit" title="切换 contain/cover">⊞</button>
    <button class="btn" type="button" id="btn-single-close">✕</button>
  </div>
  <div class="single-canvas" id="single-canvas">
    <img id="single-img" src="" alt="" draggable="false">
    <div class="magnifier" id="magnifier" hidden></div>
  </div>
  <div class="single-caption" id="single-caption"></div>
</div>

<div class="toast" id="toast"></div>
<div class="hint" id="check-hint">输入标签并检查 · 绿色=位置符合 · 红色=位置不符 · 点击卡片添加/删除标签 · 无标签时显示全部图片</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/masonry.js"></script>
<script src="/static/js/tag_check.js"></script>
</body>
</html>
