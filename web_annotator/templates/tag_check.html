<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签检查</title>
<link rel="stylesheet" href="/static/css/annotator.css">
<style>
  /* 多图模式复用 index 自然滚动; 单图模式 body 转 flex 固定布局 */
  body.mode-single { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  body.mode-single .view-single { flex: 1; min-height: 0; }
  .view-multi, .view-single {
    display: flex; flex-direction: column;
  }
  .view-multi[hidden], .view-single[hidden] { display: none; }
  .view-multi .hint { flex-shrink: 0; }
  /* 共享 toolbar: multi-only 默认显示, single-only 默认隐藏; 进入单图模式 body 加 mode-single 反转 */
  .single-only { display: none !important; }
  body.mode-single .multi-only { display: none !important; }
  body.mode-single .single-only { display: inline-flex !important; }

  #check-tag {
    background: #0a1a30; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 10px; font-size: 13px;
    width: min(260px, 30vw);
  }
  #check-position {
    background: var(--card-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px; font-size: 12px;
  }
  /* 标签补全下拉 */
  .ac-wrap { position: relative; display: inline-block; }
  .ac-popup {
    position: absolute; left: 0; top: 100%; margin-top: 2px;
    min-width: 100%; max-width: 380px;
    max-height: 340px; overflow-y: auto;
    background: #0d1b2e; border: 1px solid var(--border);
    border-radius: 4px; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    z-index: 200; font-size: 12px;
  }
  .ac-popup::-webkit-scrollbar { width: 6px; }
  .ac-popup::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  .ac-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    line-height: 1.3;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover { background: rgba(74,222,128,0.08); }
  .ac-item.ac-active { background: rgba(74,222,128,0.16); }
  .ac-tag { color: var(--text); flex: 0 1 auto; }
  .ac-tag .ac-match { color: var(--green); font-weight: 600; }
  .ac-zh { color: var(--text-dim); font-size: 11px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ac-count { color: var(--text-dim); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .ac-empty { padding: 8px 10px; color: var(--text-dim); }

  /* 列数控件：紧凑内联 */
  .cols-ctl {
    display: flex; align-items: center; gap: 3px;
    font-size: 12px; color: var(--text-dim); cursor: pointer; user-select: none;
  }
  .cols-ctl input[type="range"] { width: 64px; }

  /* 单图视图: 页面级 flex 列 (参考 paint) */
  /* stage: contain=object-fit 居中 letterbox 不滚动; cover=min-width/min-height:100% 保持比例覆盖, 溢出方向原生滚动 (仅一条滚动条) */
  .single-stage {
    flex: 1; min-height: 0; overflow: hidden; position: relative;
    cursor: crosshair;
  }
  .single-stage.cover { overflow: auto; }
  .single-stage #single-img {
    display: block; user-select: none; -webkit-user-drag: none;
  }
  .single-stage.contain #single-img {
    width: 100%; height: 100%; object-fit: contain;
  }
  .single-stage.cover #single-img {
    min-width: 100%; min-height: 100%;
  }
  /* 标签文本段: 占满剩余空间, 单行截断, 悬停看完整 */
  #single-status #seg-extra { flex: 1; max-width: none; font-family: ui-monospace, monospace; }
  /* 放大镜: fixed 跟随鼠标, 光晕颜色随标签状态 (绿=符合 红=不符 灰=无标签) */
  .magnifier {
    position: fixed; pointer-events: none; z-index: 300;
    width: 180px; height: 180px; overflow: hidden;
    border: 2px solid var(--text-dim); border-radius: 50%;
    box-shadow: 0 0 14px rgba(255,255,255,0.15);
    display: none;
  }
  .magnifier.show { display: block; }
  .magnifier-img { position: absolute; max-width: none; pointer-events: none; image-rendering: pixelated; }
  .view-single.single-ok .magnifier { border-color: var(--green); box-shadow: 0 0 16px rgba(74,222,128,0.6); }
  .view-single.single-bad .magnifier { border-color: var(--accent); box-shadow: 0 0 16px rgba(233,69,96,0.6); }
  /* 单图视图位置着色 (内阴影绘在 stage 上) */
  .view-single.single-ok .single-stage {
    box-shadow: inset 0 0 0 3px var(--green), inset 0 0 40px rgba(74,222,128,0.15);
  }
  .view-single.single-bad .single-stage {
    box-shadow: inset 0 0 0 3px var(--accent), inset 0 0 40px rgba(233,69,96,0.15);
  }

  /* 向量嵌入工具栏 */
  .toolbar-row {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap; font-size: 12px;
  }
  .emb-dlg-row { display: flex; align-items: center; gap: 8px; }
  .emb-dlg-row label { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  /* 语义检索对话框输入控件统一外观 */
  .emb-dlg-row input[type="text"],
  .emb-dlg-row input[type="number"],
  .emb-dlg-row select {
    background: var(--card-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px; font-size: 13px;
  }
  #emb-query, #emb-tag, #emb-engine { flex: 1; }
  #emb-threshold { width: 80px; text-align: center; }
  #emb-fuzzy-wrap { display: flex; align-items: center; gap: 3px; color: var(--text-dim); white-space: nowrap; font-size: 13px; }
  #emb-fuzzy-wrap input { margin: 0; }
  #emb-status { color: var(--text-dim); font-size: 11px; white-space: nowrap; }
</style>
</head>
<body>
<nav class="app-tabs" id="app-tabs"></nav>

<!-- 共享工具栏: 标签/位置/模式为两视图共用的操作目标; 检查/列数=多图专属; 切帧/fit/返回=单图专属 -->
<div class="toolbar">
  <input type="text" id="check-tag" placeholder="标签（如 1girl）" spellcheck="false">
  <select id="check-position">
    <option value="any">任意位置</option>
    <option value="before">在 ||| 前</option>
    <option value="after">在 ||| 后</option>
  </select>
  <select id="check-mode">
    <option value="top">置顶</option>
    <option value="bottom">置底</option>
    <option value="random">任意</option>
  </select>
  <button class="btn multi-only" type="button" id="btn-emb-dlg" title="相似度搜索与批量标记">相似度</button>
  <span class="sep multi-only"></span>
  <button class="btn green multi-only" type="button" id="btn-check">检查</button>
  <label class="cols-ctl multi-only" id="cols-ctl"><span>列</span><input type="range" id="cols-slider" min="0" max="16" value="0" step="1"><span id="cols-label">自动</span></label>
  <button class="btn multi-only" type="button" id="btn-single-mode">单图</button>
  <span class="sep single-only"></span>
  <button class="btn single-only" type="button" id="btn-single-close" title="返回瀑布流 (Esc)">✕ 瀑布流</button>
  <button class="btn single-only" type="button" id="btn-prev" title="上一张 (←/A)">◀</button>
  <button class="btn single-only" type="button" id="btn-next" title="下一张 (→/D)">▶</button>
  <button class="btn single-only" type="button" id="btn-fit" title="切换 contain/cover">⊞</button>
</div>

<!-- 语义检索对话框: 相似度(Reranker) 与 概念分割(SAM3) 两种引擎 -->
<div class="modal" id="emb-dlg" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-labelledby="emb-dlg-title" style="width:min(480px,92vw);height:auto;">
    <div class="modal-head">
      <span class="modal-title" id="emb-dlg-title">语义检索</span>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:12px;padding:16px;">
      <div class="emb-dlg-row">
        <label>引擎</label>
        <select id="emb-engine">
          <option value="similarity">相似度 · Qwen3-VL-Reranker-2B</option>
          <option value="concept">概念分割 · SAM3</option>
        </select>
      </div>
      <div class="emb-dlg-row">
        <label id="emb-query-label">查询文本</label>
        <input type="text" id="emb-query" placeholder="查询文本 / 概念提示词" spellcheck="false">
      </div>
      <div class="emb-dlg-row">
        <button class="btn green" type="button" id="emb-sort">按相似度排序</button>
      </div>
      <div class="job-progress compact" id="emb-progress" hidden>
        <div class="job-progress-track">
          <div class="job-progress-fill" id="emb-progress-fill"></div>
        </div>
        <span class="job-progress-pct" id="emb-progress-pct">0%</span>
      </div>
      <span id="emb-status" style="color:var(--text-dim);font-size:11px;white-space:nowrap;"></span>
      <hr style="border:none;border-top:1px solid var(--border);margin:0;">
      <div class="emb-dlg-row">
        <label>标签</label>
        <input type="text" id="emb-tag" placeholder="要添加或删除的标签" spellcheck="false">
      </div>
      <div class="emb-dlg-row">
        <label>位置</label>
        <span id="emb-position-display" style="color:var(--text);font-size:12px;">-</span>
      </div>
      <div class="emb-dlg-row">
        <select id="emb-action">
          <option value="add">添加标签</option>
          <option value="delete">删除标签</option>
        </select>
        <label id="emb-metric-label">相似度</label>
        <select id="emb-operator">
          <option value="gt">&gt;=</option>
          <option value="lt">&lt;=</option>
        </select>
        <input type="number" id="emb-threshold" value="0.5" min="0" max="1" step="0.05">
        <label id="emb-fuzzy-wrap" style="display:none"><input type="checkbox" id="emb-fuzzy">模糊匹配</label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn green" type="button" id="emb-batch-tag">批量添加</button>
      <button class="btn" type="button" id="btn-emb-close">关闭</button>
    </div>
  </div>
</div>

<!-- 多图视图 (瀑布流) -->
<div class="view-multi" id="view-multi">
  <div class="masonry" id="masonry"></div>
  <div class="hint" id="check-hint">输入标签并检查 · 绿色=位置符合 · 红色=位置不符 · 点击卡片添加/删除标签 · 右键卡片进入单图 · 无标签时显示全部图片 · 支持相似度排序、概念分割与批量标记</div>
  <div class="status-bar" id="check-status">
    <span class="status-seg">共<b id="stat-total">0</b></span>
    <span class="status-seg">符合<b id="stat-ok">0</b></span>
    <span class="status-seg">不符<b id="stat-bad">0</b></span>
  </div>
</div>

<!-- 单图视图 (参考 paint: 主图区 + 底部状态栏) -->
<div class="view-single" id="view-single" hidden>
  <div class="single-stage contain" id="single-stage">
    <img id="single-img" src="" alt="" draggable="false">
    <div class="magnifier" id="magnifier" hidden>
      <img class="magnifier-img" id="magnifier-img" alt="">
    </div>
  </div>
  <div class="filmstrip" id="filmstrip" hidden></div>
  <div class="status-bar" id="single-status">
    <span class="status-seg" id="seg-pos">0/0</span>
    <span class="status-seg" id="seg-done">符合 0</span>
    <span class="status-seg" id="seg-name">-</span>
    <span class="status-seg" id="seg-obj">-</span>
    <span class="status-seg" id="seg-metric">-</span>
    <span class="status-seg" id="seg-extra">-</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/js/ui.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/dir_picker.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/masonry.js"></script>
<script src="/static/js/filmstrip.js"></script>
<script src="/static/js/tag_check.js"></script>
</body>
</html>
